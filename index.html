<style>
/* ── DESIGN TOKENS — Warm Professional ── */
:root{
  --bg:#F5F0E8;
  --surface:#FFFFFF;
  --surface2:#FAF7F2;
  --surface3:#F0EBE1;
  --border:#E8E0D0;
  --border2:#D6CBBA;
  --primary:#8B5E3C;
  --primary-dark:#6B4423;
  --primary-light:#FBF5EE;
  --accent:#C9973A;
  --accent-light:#FEF7E8;
  --success:#2D7A4F;
  --success-light:#EBF7F0;
  --danger:#C0392B;
  --danger-light:#FDEDED;
  --warn:#B7600A;
  --warn-light:#FEF3E2;
  --purple:#6D4C9E;
  --purple-light:#F3EEFF;
  --text:#2C1810;
  --text2:#5C4033;
  --muted:#9E8070;
  --mono:'Space Mono',monospace;
  --sans:'DM Sans',sans-serif;
  --r:10px; --r2:12px;
  --shadow:0 1px 4px rgba(139,94,60,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(139,94,60,.12),0 2px 6px rgba(0,0,0,.06);
  --shadow-lg:0 12px 40px rgba(139,94,60,.16),0 4px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── APP ── */
.app{display:flex;flex-direction:column;min-height:100vh}

/* ── TOPBAR ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(139,94,60,.08)}
.brand{font-family:var(--mono);font-size:13px;color:var(--primary);letter-spacing:3px;display:flex;align-items:center;gap:10px;font-weight:700}
.brand-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.topbar-r{display:flex;align-items:center;gap:10px}
.topbar-username{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;font-weight:500}
.rbadge{font-family:var(--mono);font-size:9px;padding:3px 10px;border-radius:20px;border:1px solid;letter-spacing:1px}
.rbadge.admin{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.rbadge.supervisor{border-color:var(--success);color:var(--success);background:var(--success-light)}
.btn-out{font-family:var(--mono);font-size:9px;padding:5px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .15s;letter-spacing:.5px}
.btn-out:hover{background:var(--danger-light);border-color:var(--danger);color:var(--danger)}

/* ── MAIN ── */
.main{flex:1;padding:24px 28px;max-width:1280px;margin:0 auto;width:100%}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 60% 40%,#EDE0CC 0%,#F5F0E8 60%,#EAE0D0 100%)}
.login-card{background:#fff;border-radius:20px;padding:48px 44px;width:100%;max-width:400px;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.login-logo{font-family:var(--mono);font-size:20px;color:var(--primary);letter-spacing:3px;margin-bottom:4px;font-weight:700}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:32px;letter-spacing:.3px}

/* ── FORMS ── */
.fg{margin-bottom:16px}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r);padding:10px 14px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none;transition:all .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,151,58,.12);background:#fff}
.fg input::placeholder{color:var(--muted)}
.fg select option{background:#fff}
.fg textarea{resize:vertical;min-height:70px}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── BUTTONS ── */
.btn{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.3px;padding:10px 20px;border-radius:var(--r);border:none;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(139,94,60,.25)}.btn-primary:hover{background:var(--primary-dark)}.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:var(--surface);border:1.5px solid var(--border2);color:var(--text2)}.btn-ghost:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.btn-success{background:var(--surface);border:1.5px solid var(--success);color:var(--success)}.btn-success:hover{background:var(--success-light)}
.btn-danger{background:var(--surface);border:1.5px solid var(--border2);color:var(--muted)}.btn-danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-light)}
.btn-warn{background:var(--surface);border:1.5px solid var(--accent);color:var(--accent)}.btn-warn:hover{background:var(--accent-light)}
.btn-sm{font-size:11px;padding:6px 14px}
.btn-full{width:100%;justify-content:center}

/* ── TABS ── */
.tabs{display:flex;gap:0;margin-bottom:22px;border-bottom:2px solid var(--border);overflow-x:auto;background:var(--surface);padding:0 8px;border-radius:12px 12px 0 0;box-shadow:var(--shadow)}
.tab{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:14px 16px;background:transparent;border:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap;text-transform:uppercase}
.tab.active{color:var(--primary);border-bottom-color:var(--accent);font-weight:700}
.tab:hover:not(.active){color:var(--text2)}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:20px 22px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.ct{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mb14{margin-bottom:14px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.st{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text)}
.stat-n{font-family:var(--mono);font-size:30px;color:var(--primary);line-height:1.1;font-weight:700;margin:4px 0}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px}
.stat-card{position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
.stat-card.blue::before{background:var(--primary)}
.stat-card.green::before{background:var(--success)}
.stat-card.purple::before{background:var(--purple)}
.stat-card.gold::before{background:var(--accent)}

/* ── TABLE ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);padding:11px 14px;border-bottom:2px solid var(--border);text-align:left;white-space:nowrap;background:var(--surface2)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--primary-light)}
.mc{font-family:var(--mono);font-size:11px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;letter-spacing:.3px;padding:3px 10px;border-radius:20px}
.b-green{background:var(--success-light);color:var(--success);border:1px solid #a3d9c0}
.b-yellow{background:var(--accent-light);color:var(--accent);border:1px solid #f0d48a}
.b-red{background:var(--danger-light);color:var(--danger);border:1px solid #f0a3a3}
.b-gray{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.b-purple{background:var(--purple-light);color:var(--purple);border:1px solid #c4b0f0}

/* ── SEARCH ── */
.sbar{display:flex;gap:8px;margin-bottom:16px}
.sbar input{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r);padding:10px 14px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none}
.sbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,151,58,.1);background:#fff}

/* ── EMPLOYEE ROW ── */
.erow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r);border:1.5px solid transparent;cursor:pointer;transition:all .15s;margin-bottom:4px}
.erow:hover{background:var(--primary-light);border-color:var(--border2)}
.erow.sel{background:var(--primary-light);border-color:var(--primary)}
.avt{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.avt-y{background:var(--primary)}.avt-g{background:var(--success)}.avt-p{background:var(--purple)}
.ei{flex:1;min-width:0}
.en{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er{font-size:11px;color:var(--muted);margin-top:1px}
.etok{font-family:var(--mono);font-size:16px;color:var(--primary);text-align:right;font-weight:700}
.etl{font-size:10px;color:var(--muted);text-align:right}

/* ── SCANNER ── */
.scanbox{border:2px dashed var(--border2);border-radius:var(--r2);padding:30px 20px;text-align:center;transition:all .2s;background:var(--surface2)}
.scanbox.live{border-color:var(--success);background:var(--success-light)}
.scan-icon{font-size:36px;margin-bottom:10px}
.scan-input{width:100%;max-width:270px;background:#fff;border:2px solid var(--accent);border-radius:var(--r);padding:10px 14px;color:var(--text);font-family:var(--mono);font-size:14px;outline:none;text-align:center;letter-spacing:2px;margin-bottom:12px;box-shadow:0 0 0 3px rgba(201,151,58,.1)}
.scan-hint{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6}

/* ── CAMERA ── */
.cam-wrap{position:relative;border-radius:var(--r2);overflow:hidden;background:#000;margin-bottom:12px}
.cam-wrap video{width:100%;display:block;max-height:240px;object-fit:cover}
.cam-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:150px;height:150px;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
.cam-line{position:absolute;left:50%;transform:translateX(-50%);width:130px;height:2px;background:var(--accent);opacity:.9;animation:scan 1.8s linear infinite}
@keyframes scan{0%{top:calc(50% - 75px)}100%{top:calc(50% + 75px)}}
.cam-foot{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);padding:7px;text-align:center;font-size:10px;color:var(--accent);font-family:var(--mono)}

/* ── VERIFY BADGES ── */
.verify-badge{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 18px;border-radius:var(--r);margin-bottom:14px;font-size:13px;font-weight:600;letter-spacing:.3px}
.vb-success{background:var(--success-light);border:1.5px solid #a3d9c0;color:var(--success)}
.vb-error{background:var(--danger-light);border:1.5px solid #f0a3a3;color:var(--danger)}
.vb-info{background:var(--accent-light);border:1.5px solid #f0d48a;color:var(--primary-dark)}
.vb-warn{background:var(--warn-light);border:1.5px solid #f0cc8a;color:var(--warn)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(44,24,16,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-size:13px;font-weight:700;color:var(--primary-dark);letter-spacing:.5px;text-transform:uppercase;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.modal-footer{display:flex;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}

/* ── SESSION LOG ── */
.slog-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.slog-item:last-child{border-bottom:none}

/* ── TOASTS ── */
.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:6px;z-index:300}
.toast{font-size:12px;font-weight:500;padding:11px 18px;border-radius:var(--r);border-left:4px solid;animation:tin .2s ease;max-width:320px;background:#fff;box-shadow:var(--shadow-md)}
.toast.success{border-left-color:var(--success);color:var(--success)}
.toast.error{border-left-color:var(--danger);color:var(--danger)}
.toast.info{border-left-color:var(--accent);color:var(--primary)}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── DEMO BANNER ── */
.demo-banner{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 18px;margin-bottom:22px;font-size:11px;color:var(--muted);font-family:var(--mono);display:flex;align-items:center;gap:8px}

/* ── PAYOUT ── */
.payout-box{background:linear-gradient(135deg,var(--primary-light),var(--accent-light));border:1.5px solid var(--border2);border-radius:var(--r2);padding:20px;text-align:center}
.payout-amount{font-family:var(--mono);font-size:34px;color:var(--success);line-height:1;margin:8px 0;font-weight:700}
.payout-stats-row{display:flex;justify-content:center;gap:28px;margin-top:12px;flex-wrap:wrap}

/* ── REPORTS ── */
.report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.report-date{font-size:11px;color:var(--muted)}

/* ── TOKEN CHECKLIST ── */
.tok-check-list{max-height:280px;overflow-y:auto;border:1.5px solid var(--border);border-radius:var(--r);margin-bottom:12px;background:#fff}
.tok-check-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.tok-check-item:last-child{border-bottom:none}
.tok-check-item:hover{background:var(--surface2)}
.tok-check-item.tsel{background:var(--success-light)}
.tok-check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--success);cursor:pointer;flex-shrink:0}
.tok-id{font-family:var(--mono);font-size:11px;color:var(--primary);flex:1;font-weight:600}
.tok-val{font-family:var(--mono);font-size:11px;color:var(--success);font-weight:600}
.tok-by{font-size:10px;color:var(--muted)}
.tok-sel-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);border-radius:var(--r);margin-bottom:8px;font-size:11px;color:var(--muted);border:1px solid var(--border)}

/* ── ANIMATIONS ── */
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.pop{animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.err-msg{font-size:11px;color:var(--danger);margin-top:8px;text-align:center;font-weight:500}

/* ── FULLSCREEN FEEDBACK ── */
.fs-overlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fsPop .25s ease}
.fs-overlay.success{background:rgba(45,122,79,.96)}
.fs-overlay.error{background:rgba(192,57,43,.96)}
.fs-overlay.warn{background:rgba(183,96,10,.96)}
.fs-icon{font-size:90px;line-height:1;margin-bottom:20px;animation:fsBounce .4s cubic-bezier(.175,.885,.32,1.275)}
.fs-title{font-family:var(--mono);font-size:20px;font-weight:700;color:#fff;letter-spacing:2px;text-align:center;padding:0 20px}
.fs-sub{font-size:15px;color:rgba(255,255,255,.85);margin-top:10px;text-align:center;padding:0 24px;line-height:1.5}
@keyframes fsPop{from{opacity:0}to{opacity:1}}
@keyframes fsBounce{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ── MOBILE ── */
@media(max-width:640px){
  .g2,.g3,.g4,.fg-row,.fg-row3{grid-template-columns:1fr}
  .main{padding:14px 12px}
  .topbar{padding:0 14px;height:54px}
  .tabs{margin-bottom:14px}
  .tab{font-size:8px;padding:12px 10px}
  .card{padding:14px}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:100% !important;border-radius:16px 16px 0 0;padding:20px 16px;max-height:92vh}
  .modal-footer{flex-direction:column}
  .modal-footer .btn{width:100%;justify-content:center}
  .scanbox{padding:20px 14px}
  .scan-input{max-width:100%;font-size:13px}
  .toast-wrap{left:10px;right:10px;bottom:12px}
  .toast{max-width:100%}
  .report-header{flex-direction:column;gap:6px;align-items:flex-start}
  .tok-check-list{max-height:220px}
  .tok-by{display:none}
  .payout-stats-row{gap:14px}
}
@media(hover:none) and (pointer:coarse){
  .btn,.tab,.erow,.tok-check-item{min-height:44px}
  .btn-sm{min-height:38px}
  input,select{font-size:16px !important}
}
</style>

<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;
const TOKEN_VALUE = 100;
const today = () => new Date().toISOString().split('T')[0];
const nowTs = () => new Date().toISOString();
const fmtTime = (ts) => ts ? new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : '—';
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-IN') : '—';

const db = {
  login: async (u,p) => {
    if(u==='admin'&&p==='admin123') return{role:'admin',name:'Administrator',id:'ADMIN'};
    const snap=await firestore.collection('supervisors').where('username','==',u).where('password','==',p).where('active','==',true).get();
    if(snap.empty) throw new Error('Invalid credentials');
    const s=snap.docs[0].data();
    return{role:'supervisor',name:s.name,id:s.id,qrId:s.qrId};
  },
  loginByQR: async (qrId) => {
    const snap=await firestore.collection('supervisors').where('qrId','==',qrId.trim().toUpperCase()).where('active','==',true).get();
    if(snap.empty) throw new Error('Supervisor QR not recognised');
    const s=snap.docs[0].data();
    return{role:'supervisor',name:s.name,id:s.id,qrId:s.qrId};
  },
  getEmployees: async () => { const snap=await firestore.collection('employees').orderBy('name').get(); return snap.docs.map(d=>d.data()); },
  getEmployeeById: async (id) => { const doc=await firestore.collection('employees').doc(id.trim().toUpperCase()).get(); return doc.exists?doc.data():null; },
  addEmployee: async (emp) => { await firestore.collection('employees').doc(emp.id).set(emp); },
  updateEmployee: async (emp) => { await firestore.collection('employees').doc(emp.id).set(emp,{merge:true}); },
  removeEmployee: async (id) => { await firestore.collection('employees').doc(id).delete(); },
  getTokens: async () => { const snap=await firestore.collection('tokens').get(); return snap.docs.map(d=>d.data()); },
  getToken: async (id) => { const doc=await firestore.collection('tokens').doc(id.trim().toUpperCase()).get(); return doc.exists?doc.data():null; },

  // ── CHANGE 2 HELPER: fetch all tokens assigned to an employee ──
  getTokensByEmployee: async (empId) => {
    const snap=await firestore.collection('tokens').where('assignedTo','==',empId).get();
    return snap.docs.map(d=>d.data());
  },

  registerToken: async (tok) => { await firestore.collection('tokens').doc(tok.id).set(tok); },
  updateToken: async (tok) => { await firestore.collection('tokens').doc(tok.id).set(tok,{merge:true}); },

  // ── CHANGE 1: Delete token even if assigned — de-allocates from employee ──
  deleteToken: async (tokenId) => {
    const tokRef=firestore.collection('tokens').doc(tokenId);
    const tokDoc=await tokRef.get();
    if(!tokDoc.exists) throw new Error('Token not found');
    const t=tokDoc.data();
    // Step 1: if assigned, update employee first (separate write)
    if(t.assignedTo){
      const empRef=firestore.collection('employees').doc(t.assignedTo);
      const empDoc=await empRef.get();
      if(empDoc.exists){
        const current=empDoc.data().totalTokens||0;
        await empRef.update({
          tokens: firebase.firestore.FieldValue.arrayRemove(tokenId),
          totalTokens: Math.max(0, current-1)
        });
      }
    }
    // Step 2: delete the token
    await tokRef.delete();
  },

  assignToken: async (tokenId,empId,supId,supName,sessionId) => {
    const supSnap=await firestore.collection('supervisors').where('qrId','==',empId).get();
    if(!supSnap.empty) throw new Error('❌ Supervisor ID detected — cannot assign token');
    const tokRef=firestore.collection('tokens').doc(tokenId);
    const tokDoc=await tokRef.get();
    if(!tokDoc.exists) throw new Error('Token not registered: '+tokenId+' — ask admin to register it first');
    const t=tokDoc.data();
    if(t.lockedDate===today()) throw new Error('❌ Token already used today');
    await tokRef.set({...t,assignedTo:empId,assignedAt:nowTs(),assignedBy:supName,assignedBySup:supId,sessionId,lockedDate:today()});
    const empRef=firestore.collection('employees').doc(empId);
    await empRef.update({tokens:firebase.firestore.FieldValue.arrayUnion(tokenId),totalTokens:firebase.firestore.FieldValue.increment(1)});
  },

  payEmployee: async (empId,partialTokens=null,resetByAdmin=false) => {
    const empRef=firestore.collection('employees').doc(empId);
    const empDoc=await empRef.get();
    if(!empDoc.exists) throw new Error('Employee not found');
    const e=empDoc.data();
    const pendingTokens=e.totalTokens||0;
    let tokensToPay=partialTokens!==null?Number(partialTokens):pendingTokens;
    if(tokensToPay<=0) throw new Error('No tokens available');
    if(tokensToPay>pendingTokens) throw new Error('Invalid token count');
    const amount=tokensToPay*(e.tokenValue||TOKEN_VALUE);
    const txnId='TXN'+Date.now();
    await firestore.collection('transactions').doc(txnId).set({
      id:txnId,employeeId:empId,employeeName:e.name,tokensPaid:tokensToPay,amount,
      date:today(),timestamp:nowTs(),type:partialTokens!==null?'partial':'full',
      adminReset:resetByAdmin,
      remainingTokens:pendingTokens-tokensToPay,
      remainingAmount:(pendingTokens-tokensToPay)*(e.tokenValue||TOKEN_VALUE)
    });
    if(partialTokens===null||tokensToPay===pendingTokens||resetByAdmin){
      const tokSnap=await firestore.collection('tokens').where('assignedTo','==',empId).get();
      const batch=firestore.batch();
      tokSnap.docs.forEach(d=>batch.update(d.ref,{assignedTo:null,assignedAt:null,assignedBy:null,assignedBySup:null,sessionId:null,lockedDate:null}));
      batch.update(empRef,{tokens:[],totalTokens:0,paidTokens:firebase.firestore.FieldValue.increment(tokensToPay),partialPaidTokens:0});
      await batch.commit();
    } else {
      await empRef.update({totalTokens:firebase.firestore.FieldValue.increment(-tokensToPay),paidTokens:firebase.firestore.FieldValue.increment(tokensToPay),partialPaidTokens:firebase.firestore.FieldValue.increment(tokensToPay)});
    }
    return{amount,tokensPaid:tokensToPay};
  },

  // ── CHANGE 2: Pay only the specifically selected token IDs ──
  paySelectedTokens: async (empId, selectedTokenIds) => {
    if(!selectedTokenIds||selectedTokenIds.length===0) throw new Error('No tokens selected');
    const empRef=firestore.collection('employees').doc(empId);
    const empDoc=await empRef.get();
    if(!empDoc.exists) throw new Error('Employee not found');
    const e=empDoc.data();
    const pendingTokens=e.totalTokens||0;
    if(selectedTokenIds.length>pendingTokens) throw new Error('Invalid token selection');
    // fetch real token docs to get their values
    const tokDocs=await Promise.all(selectedTokenIds.map(id=>firestore.collection('tokens').doc(id).get()));
    const amount=tokDocs.reduce((sum,d)=>sum+(d.exists?(d.data().value||TOKEN_VALUE):TOKEN_VALUE),0);
    const txnId='TXN'+Date.now();
    await firestore.collection('transactions').doc(txnId).set({
      id:txnId,employeeId:empId,employeeName:e.name,
      tokensPaid:selectedTokenIds.length,amount,date:today(),timestamp:nowTs(),
      type:'selected',tokenIds:selectedTokenIds,
      remainingTokens:pendingTokens-selectedTokenIds.length,
      remainingAmount:(pendingTokens-selectedTokenIds.length)*(e.tokenValue||TOKEN_VALUE)
    });
    const batch=firestore.batch();
    // free the paid tokens — available for reassignment
    tokDocs.forEach(d=>{
      if(d.exists) batch.update(d.ref,{assignedTo:null,assignedAt:null,assignedBy:null,assignedBySup:null,sessionId:null,lockedDate:null});
    });
    // remove paid token IDs from employee array, decrement count
    batch.update(empRef,{
      tokens: firebase.firestore.FieldValue.arrayRemove(...selectedTokenIds),
      totalTokens: firebase.firestore.FieldValue.increment(-selectedTokenIds.length),
      paidTokens: firebase.firestore.FieldValue.increment(selectedTokenIds.length),
      partialPaidTokens: firebase.firestore.FieldValue.increment(selectedTokenIds.length)
    });
    await batch.commit();
    return{amount,tokensPaid:selectedTokenIds.length};
  },

  getSupervisors: async () => { const snap=await firestore.collection('supervisors').get(); return snap.docs.map(d=>d.data()); },
  addSupervisor: async (s) => { await firestore.collection('supervisors').doc(s.id).set(s); },
  updateSupervisor: async (s) => { await firestore.collection('supervisors').doc(s.id).set(s,{merge:true}); },
  removeSupervisor: async (id) => { await firestore.collection('supervisors').doc(id).delete(); },
  getTransactions: async () => { const snap=await firestore.collection('transactions').orderBy('timestamp','desc').get(); return snap.docs.map(d=>d.data()); },
  universalScan: async (qr) => {
    const val=qr.trim().toUpperCase();
    const empDoc=await firestore.collection('employees').doc(val).get();
    if(empDoc.exists) return{type:'employee',data:empDoc.data()};
    const supSnap=await firestore.collection('supervisors').where('qrId','==',val).get();
    if(!supSnap.empty){const s=supSnap.docs[0].data();const tokSnap=await firestore.collection('tokens').where('assignedBySup','==',s.id).get();return{type:'supervisor',data:{...s,totalAssigned:tokSnap.size}};}
    const tokDoc=await firestore.collection('tokens').doc(val).get();
    if(tokDoc.exists){const t=tokDoc.data();let employee=null;if(t.assignedTo){const ed=await firestore.collection('employees').doc(t.assignedTo).get();if(ed.exists)employee=ed.data();}return{type:'token',data:{...t,employee}};}
    return{type:'unknown',data:{qr:val}};
  },
};

function playBeep(type='success'){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);if(type==='success'){o.frequency.setValueAtTime(880,ctx.currentTime);o.frequency.setValueAtTime(1100,ctx.currentTime+0.1);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);o.start(ctx.currentTime);o.stop(ctx.currentTime+0.3);}else if(type==='error'){o.frequency.setValueAtTime(220,ctx.currentTime);g.gain.setValueAtTime(0.4,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);o.start(ctx.currentTime);o.stop(ctx.currentTime+0.4);}else if(type==='assign'){o.frequency.setValueAtTime(660,ctx.currentTime);o.frequency.setValueAtTime(880,ctx.currentTime+0.08);o.frequency.setValueAtTime(1320,ctx.currentTime+0.16);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);o.start(ctx.currentTime);o.stop(ctx.currentTime+0.35);}}catch(e){}}

function FullScreenFeedback({type,icon,title,sub,onDone}){
  useEffect(()=>{playBeep(type==='error'?'error':type==='assign'?'assign':'success');const t=setTimeout(onDone,type==='error'?2200:1800);return()=>clearTimeout(t);},[]);
  const cls=type==='error'?'error':'success';
  return(<div className={`fs-overlay ${cls}`} onClick={onDone}><div className="fs-icon">{icon}</div><div className="fs-title">{title}</div>{sub&&<div className="fs-sub">{sub}</div>}<div style={{marginTop:24,fontFamily:'var(--mono)',fontSize:10,color:'rgba(255,255,255,.6)',letterSpacing:2}}>TAP TO DISMISS</div></div>);
}

function useToast(){
  const[toasts,setToasts]=useState([]);
  const show=(msg,type='info')=>{const id=Date.now();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500);};
  return{toasts,show};
}

function CamScanner({onScan,onClose,label=''}){
  const vidRef=useRef();const canRef=useRef();const streamRef=useRef();const animRef=useRef();
  const[status,setStatus]=useState('Starting camera...');const[camErr,setCamErr]=useState(null);const lastRef=useRef('');
  useEffect(()=>{
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{streamRef.current=stream;if(vidRef.current){vidRef.current.srcObject=stream;vidRef.current.play();setStatus(label||'Point at QR code...');}animRef.current=requestAnimationFrame(tick);}).catch(()=>setCamErr('Camera access denied. Use manual input below.'));
    return()=>{streamRef.current?.getTracks().forEach(t=>t.stop());cancelAnimationFrame(animRef.current);};
  },[]);
  const tick=()=>{const v=vidRef.current,c=canRef.current;if(v&&c&&v.readyState===v.HAVE_ENOUGH_DATA){c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const img=c.getContext('2d').getImageData(0,0,c.width,c.height);const code=window.jsQR&&window.jsQR(img.data,img.width,img.height);if(code&&code.data&&code.data!==lastRef.current){lastRef.current=code.data;setStatus('✓ Scanned: '+code.data);onScan(code.data);setTimeout(()=>{lastRef.current='';setStatus(label||'Ready for next scan...');},2000);}}animRef.current=requestAnimationFrame(tick);};
  return(<div><div className="cam-wrap">{camErr?<div style={{padding:32,textAlign:'center',color:'var(--danger)',fontSize:13}}>{camErr}</div>:(<><video ref={vidRef} playsInline muted style={{width:'100%',maxHeight:240,objectFit:'cover',display:'block'}}/><canvas ref={canRef} style={{display:'none'}}/><div className="cam-frame"/><div className="cam-line"/><div className="cam-foot">{status}</div></>)}</div><button className="btn btn-danger btn-sm" onClick={onClose}>✕ Close camera</button></div>);
}

function Login({onLogin}){

    {err&&<div className="err-msg">{err}</div>}
  </div></div>);

      <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',letterSpacing:1.5,textTransform:'uppercase',marginBottom:8}}>Step 2 — Set Token Value</div>

function PayoutModal({emp,onClose,onDone,toast}){
  const[busy,setBusy]=useState(false);
  const[empTokens,setEmpTokens]=useState([]);
  const[loading,setLoading]=useState(true);
  const[selected,setSelected]=useState({});
  if(!emp) return null;

  useEffect(()=>{
    setLoading(true);
    db.getTokensByEmployee(emp.id).then(toks=>{
      setEmpTokens(toks);
      const sel={};toks.forEach(t=>sel[t.id]=true);
      setSelected(sel);setLoading(false);
    }).catch(()=>setLoading(false));
  },[emp.id]);

  const pending=emp.totalTokens||0;
  const selectedIds=Object.keys(selected).filter(id=>selected[id]);
  const selectedCount=selectedIds.length;
  const selectedAmount=empTokens.filter(t=>selected[t.id]).reduce((s,t)=>s+(t.value||TOKEN_VALUE),0);
  const allSelected=selectedCount===empTokens.length&&empTokens.length>0;

  const toggleAll=()=>{const sel={};if(!allSelected){empTokens.forEach(t=>sel[t.id]=true);}setSelected(sel);};
  const toggleOne=(id)=>setSelected(prev=>({...prev,[id]:!prev[id]}));

  const doPay=async()=>{
    if(selectedCount===0){toast.show('Select at least one token to pay','error');return;}
    setBusy(true);
    try{
      let res;
      if(selectedCount===empTokens.length){
        res=await db.payEmployee(emp.id);
      } else {
        res=await db.paySelectedTokens(emp.id,selectedIds);
      }
      toast.show(`✓ Paid ₹${res.amount} (${res.tokensPaid} tokens) to ${emp.name}`,'success');
      onDone();onClose();
    }catch(e){toast.show(e.message,'error');}finally{setBusy(false);}
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:500}} onClick={e=>e.stopPropagation()}>
        <div className="modal-title">💰 Payout — Select Tokens</div>

        <div className="payout-box" style={{padding:14,marginBottom:16}}>
          <div style={{fontSize:13,color:'var(--muted)'}}>Employee</div>
          <div style={{fontSize:18,fontWeight:600,marginTop:4}}>{emp.name}</div>
          <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--muted)',marginTop:2}}>{emp.id}</div>
          <div className="payout-stats-row">
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:2}}>TOTAL PENDING</div>
              <div style={{fontFamily:'var(--mono)',fontSize:22,color:'var(--primary-dark)'}}>{pending}</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:2}}>SELECTED</div>
              <div style={{fontFamily:'var(--mono)',fontSize:22,color:'var(--success)'}}>{selectedCount}</div>
            </div>
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:2}}>PAYABLE</div>
              <div style={{fontFamily:'var(--mono)',fontSize:22,color:'var(--success)'}}>₹{selectedAmount.toLocaleString('en-IN')}</div>
            </div>
          </div>
        </div>

        {loading?(
          <div style={{textAlign:'center',padding:24,color:'var(--muted)',fontFamily:'var(--mono)',fontSize:11}}>Loading tokens...</div>
        ):empTokens.length===0?(
          <div className="verify-badge vb-warn">No tokens currently assigned to this employee</div>
        ):(
          <>
            <div className="tok-sel-bar">
              <span>{selectedCount} of {empTokens.length} selected</span>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <button className="btn btn-ghost btn-sm" style={{padding:'3px 10px',fontSize:9}} onClick={toggleAll}>{allSelected?'Deselect All':'Select All'}</button>
                {selectedCount===empTokens.length&&<span style={{color:'var(--success)',fontSize:9}}>FULL PAY</span>}
                {selectedCount>0&&selectedCount<empTokens.length&&<span style={{color:'var(--warn)',fontSize:9}}>PARTIAL</span>}
              </div>
            </div>
            <div className="tok-check-list">
              {empTokens.map(t=>(
                <div key={t.id} className={`tok-check-item ${selected[t.id]?'tsel':''}`} onClick={()=>toggleOne(t.id)}>
                  <input type="checkbox" checked={!!selected[t.id]} onChange={()=>toggleOne(t.id)} onClick={e=>e.stopPropagation()}/>
                  <span className="tok-id">{t.id}</span>
                  <span className="tok-val">₹{t.value||TOKEN_VALUE}</span>
                  <span className="tok-by">{t.assignedBy?`  ${t.assignedBy}`:''}</span>
                  <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginLeft:4}}>{t.lockedDate||''}</span>
                </div>
              ))}
            </div>
            {selectedCount>0&&selectedCount<empTokens.length&&(
              <div style={{padding:'8px 12px',background:'rgba(240,147,58,.07)',border:'1px solid rgba(240,147,58,.25)',borderRadius:6,fontSize:11,color:'var(--warn)',marginBottom:8,fontFamily:'var(--mono)'}}>
                ⚠️ {empTokens.length-selectedCount} token(s) will remain with {emp.name}. Paid tokens will be freed for reassignment.
              </div>
            )}
            {allSelected&&(
              <div style={{padding:'8px 12px',background:'rgba(240,79,94,.05)',border:'1px solid rgba(240,79,94,.2)',borderRadius:6,fontSize:11,color:'var(--muted)',marginBottom:8}}>
                ⚠️ All tokens selected — full payment. All tokens will be reset and freed.
              </div>
            )}
          </>
        )}

        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-warn" onClick={doPay} disabled={busy||selectedCount===0||loading}>
            {busy?'Processing...':`PAY ₹${selectedAmount.toLocaleString('en-IN')} (${selectedCount} tokens)`}
          </button>
        </div>
      </div>
    </div>
  );
}

      {result.type==='token'&&(<div><div className={`verify-badge pop ${result.data.assignedTo?'vb-success':'vb-info'}`}>🎟️ Token — {result.data.assignedTo?'Assigned':'Free'}</div><div className="card"><div className="g2"><div><div className="ct">Token ID</div><div style={{fontFamily:'var(--mono)',fontSize:13,color:'var(--success)'}}>{result.data.id}</div></div><div><div className="ct">Date</div><div style={{fontFamily:'var(--mono)',fontSize:12}}>{result.data.lockedDate||'—'}</div></div><div><div className="ct">Assigned To</div><div style={{fontFamily:'var(--mono)',fontSize:12}}>{result.data.assignedTo||'—'}</div></div><div><div className="ct">Assigned By</div><div style={{fontSize:12}}>{result.data.assignedBy||'—'}</div></div></div>{result.data.employee&&(<div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}}><div className="ct" style={{marginBottom:8}}>Employee</div><div className="erow" style={{cursor:'default'}}><div className="avt avt-y">{result.data.employee.name.charAt(0)}</div><div className="ei"><div className="en">{result.data.employee.name}</div><div className="er">{result.data.employee.id}</div></div></div></div>)}</div></div>)}
      {result.type==='unknown'&&<div className="verify-badge vb-error pop">❌ QR Not Recognised: {result.data.qr}</div>}
    </div>)}
    <div className="modal-footer"><button className="btn btn-ghost" onClick={()=>{setResult(null);setManual('');}}>🔄 Scan Again</button><button className="btn btn-ghost" onClick={onClose}>Close</button></div>
  </div></div>);
}

function DateFilter({fromDate,toDate,setFromDate,setToDate}){
  return(<div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',marginBottom:16,padding:'12px 14px',background:'var(--surface2)',borderRadius:8}}>
    <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',letterSpacing:1}}>DATE RANGE</div>
    <div style={{display:'flex',gap:8,alignItems:'center'}}>
      <input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 8px',color:'var(--text)',fontFamily:'var(--mono)',fontSize:11}}/>
      <span style={{color:'var(--muted)',fontSize:11}}>to</span>
      <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 8px',color:'var(--text)',fontFamily:'var(--mono)',fontSize:11}}/>
    </div>
    <button className="btn btn-ghost btn-sm" onClick={()=>{setFromDate(today());setToDate(today());}}>Today</button>
    <button className="btn btn-ghost btn-sm" onClick={()=>{const d=new Date();d.setDate(d.getDate()-6);setFromDate(d.toISOString().split('T')[0]);setToDate(today());}}>Last 7 days</button>
    <button className="btn btn-ghost btn-sm" onClick={()=>{const d=new Date();d.setDate(1);setFromDate(d.toISOString().split('T')[0]);setToDate(today());}}>This month</button>
  </div>);
}

function exportToExcel(sheets,filename){
  const wb=XLSX.utils.book_new();
  sheets.forEach(({name,data})=>{const ws=XLSX.utils.aoa_to_sheet(data);const colWidths=data[0]?data[0].map((_,ci)=>({wch:Math.max(...data.map(r=>String(r[ci]||'').length),10)})):[];ws['!cols']=colWidths;XLSX.utils.book_append_sheet(wb,ws,name.substring(0,31));});
  XLSX.writeFile(wb,filename);
}

function ReportsPanel({tokens,employees,supervisors,transactions}){
  const[rTab,setRTab]=useState('daily');
  const[fromDate,setFromDate]=useState(today());const[toDate,setToDate]=useState(today());
  const[empFromDate,setEmpFromDate]=useState('');const[empToDate,setEmpToDate]=useState('');
  const[selEmp,setSelEmp]=useState('');const[selSup,setSelSup]=useState('');
  const[txFromDate,setTxFromDate]=useState('');const[txToDate,setTxToDate]=useState('');
  const inRange=(date,from,to)=>{if(!date)return false;if(from&&date<from)return false;if(to&&date>to)return false;return true;};
  const dailyToks=tokens.filter(t=>t.lockedDate&&inRange(t.lockedDate,fromDate,toDate));
  const byDate={};dailyToks.forEach(t=>{const d=t.lockedDate;if(!byDate[d])byDate[d]={date:d,tokens:[],total:0,value:0};byDate[d].tokens.push(t);byDate[d].total++;byDate[d].value+=(t.value||TOKEN_VALUE);});
  const dailySummaryRows=Object.values(byDate).sort((a,b)=>b.date.localeCompare(a.date));
  const dateViewToks=tokens.filter(t=>t.lockedDate&&inRange(t.lockedDate,fromDate,toDate));
  const dateViewByEmp={};dateViewToks.forEach(t=>{const empId=t.assignedTo||'UNKNOWN';if(!dateViewByEmp[empId])dateViewByEmp[empId]={empId,tokens:[],value:0};dateViewByEmp[empId].tokens.push(t);dateViewByEmp[empId].value+=(t.value||TOKEN_VALUE);});
  const dateViewRows=Object.values(dateViewByEmp).map(row=>{const emp=employees.find(e=>e.id===row.empId);return{...row,empName:emp?emp.name:row.empId};}).sort((a,b)=>b.tokens.length-a.tokens.length);
  const empRangeActive=!!(empFromDate||empToDate);
  const empToks=tokens.filter(t=>{if(!t.assignedTo)return false;if(selEmp&&t.assignedTo!==selEmp)return false;if(empRangeActive&&!inRange(t.lockedDate,empFromDate||'2020-01-01',empToDate||'2099-12-31'))return false;return true;});
  const empHistory=employees.filter(e=>!selEmp||e.id===selEmp).map(e=>{const toks=empToks.filter(t=>t.assignedTo===e.id);const totalValue=toks.reduce((s,t)=>s+(t.value||TOKEN_VALUE),0);const txns=transactions.filter(t=>t.employeeId===e.id);const totalPaid=txns.reduce((s,t)=>s+t.amount,0);return{...e,assignedToks:toks,totalValue,txns,totalPaid};}).filter(e=>e.assignedToks.length>0||selEmp);
  const supToks=tokens.filter(t=>t.assignedBySup&&inRange(t.lockedDate,fromDate,toDate)&&(!selSup||t.assignedBySup===selSup));
  const supByDate={};supToks.forEach(t=>{const key=`${t.assignedBySup}__${t.lockedDate}`;if(!supByDate[key])supByDate[key]={supId:t.assignedBySup,supName:t.assignedBy,date:t.lockedDate,count:0,value:0};supByDate[key].count++;supByDate[key].value+=(t.value||TOKEN_VALUE);});
  const supRows=Object.values(supByDate).sort((a,b)=>b.date.localeCompare(a.date)||b.count-a.count);
  const supTotals=supervisors.map(s=>{const rows=supRows.filter(r=>r.supId===s.id);return{...s,periodCount:rows.reduce((x,r)=>x+r.count,0),periodValue:rows.reduce((x,r)=>x+r.value,0)};}).filter(s=>s.periodCount>0||selSup===s.id);
  const filteredTxns=transactions.filter(t=>inRange(t.date,txFromDate||'2020-01-01',txToDate||'2099-12-31'));
  const txTotal=filteredTxns.reduce((s,t)=>s+t.amount,0);const txTokens=filteredTxns.reduce((s,t)=>s+t.tokensPaid,0);
  const exportDaily=()=>{const rl=fromDate===toDate?fromDate:`${fromDate} to ${toDate}`;const rows=[[`Daily Summary Report — ${rl}`],[`Generated: ${new Date().toLocaleString('en-IN')}`],[],['Date','Tokens Assigned','Total Value (INR)','Unique Employees','Unique Supervisors'],...dailySummaryRows.map(row=>{const ei=[...new Set(row.tokens.map(t=>t.assignedTo))];const si=[...new Set(row.tokens.map(t=>t.assignedBySup).filter(Boolean))];return[row.date,row.total,row.value,ei.length,si.length];}),[], ['TOTAL','',dailyToks.reduce((s,t)=>s+(t.value||TOKEN_VALUE),0),'','']];exportToExcel([{name:'Daily Summary',data:rows}],`daily-summary-${fromDate}-to-${toDate}.xlsx`);};
  const exportByDate=()=>{const rl=fromDate===toDate?fromDate:`${fromDate} to ${toDate}`;const sr=[[`By Date Report — ${rl}`],['Generated: '+new Date().toLocaleString('en-IN')],[],['Employee Name','Employee ID','Tokens','Value (INR)','Token IDs'],...dateViewRows.map(row=>[row.empName,row.empId,row.tokens.length,row.value,row.tokens.map(t=>t.id).join(', ')]),[], ['TOTAL','',dateViewToks.length,dateViewToks.reduce((s,t)=>s+(t.value||TOKEN_VALUE),0),'']];const tr=[['Full Token Trace'],[],['Token ID','Employee ID','Supervisor','Supervisor ID','Date','Time'],...[...dateViewToks].sort((a,b)=>(b.assignedAt||'').localeCompare(a.assignedAt||'')).map(t=>[t.id,t.assignedTo,t.assignedBy||'',t.assignedBySup||'',t.lockedDate,fmtTime(t.assignedAt)])];exportToExcel([{name:'Employee Breakdown',data:sr},{name:'Token Trace',data:tr}],`by-date-${fromDate}-to-${toDate}.xlsx`);};
  const exportByEmployee=()=>{const dl=empRangeActive?`${empFromDate||'All'} to ${empToDate||'All'}`:'All Time';const sd=[[`By Employee Report — ${dl}`],['Generated: '+new Date().toLocaleString('en-IN')],[],['Employee Name','Employee ID','Mobile','Tokens in Range','Value (INR)','Pending Tokens','Paid Tokens','Total Paid Out (INR)'],...empHistory.map(e=>[e.name,e.id,e.mobile||'',e.assignedToks.length,e.totalValue,e.totalTokens||0,e.paidTokens||0,e.totalPaid])];const sheets=[{name:'Summary',data:sd}];empHistory.forEach(e=>{const sn=e.name.substring(0,25)||e.id;const rows=[[e.name,e.id],[],['Token ID','Value (INR)','Assigned By','Date','Time'],...e.assignedToks.sort((a,b)=>(b.assignedAt||'').localeCompare(a.assignedAt||'')).map(t=>[t.id,t.value||TOKEN_VALUE,t.assignedBy||'',t.lockedDate||'',fmtTime(t.assignedAt)])];if(e.txns.length>0){rows.push([]);rows.push(['Payout History']);rows.push(['Txn ID','Tokens Paid','Amount (INR)','Date']);e.txns.forEach(t=>rows.push([t.id,t.tokensPaid,t.amount,t.date]));}sheets.push({name:sn,data:rows});});exportToExcel(sheets,`by-employee-${today()}.xlsx`);};
  const exportSupervisor=()=>{const pd=[[`Supervisor Report — ${fromDate} to ${toDate}`],['Generated: '+new Date().toLocaleString('en-IN')],[],['Supervisor Name','ID','Tokens Assigned','Total Value (INR)'],...supTotals.map(s=>[s.name,s.id,s.periodCount,s.periodValue])];const ld=[['Day-by-day Log'],[],['Date','Supervisor Name','Supervisor ID','Tokens','Value (INR)'],...supRows.map(r=>[r.date,r.supName||r.supId,r.supId,r.count,r.value])];exportToExcel([{name:'Performance',data:pd},{name:'Daily Log',data:ld}],`supervisor-${fromDate}-to-${toDate}.xlsx`);};
  const exportPayout=()=>{const rl=txFromDate||txToDate?`${txFromDate||'All'} to ${txToDate||'All'}`:'All Time';const rows=[[`Payout History — ${rl}`],['Generated: '+new Date().toLocaleString('en-IN')],[],['Txn ID','Employee Name','Employee ID','Tokens Paid','Amount (INR)','Date','Time'],...filteredTxns.map(t=>[t.id,t.employeeName,t.employeeId,t.tokensPaid,t.amount,t.date,fmtTime(t.timestamp)]),[], ['TOTAL','','',txTokens,txTotal,'','']];exportToExcel([{name:'Payout History',data:rows}],`payout-history-${today()}.xlsx`);};
  const RTABS=[{id:'daily',label:'📅 Daily Summary'},{id:'date',label:'📆 By Date'},{id:'employee',label:'👤 By Employee'},{id:'supervisor',label:'⚡ Supervisor'},{id:'payout',label:'💰 Payout History'}];
  const XlBtn=({onClick,disabled})=>(<button className="btn btn-success btn-sm" onClick={onClick} disabled={disabled} style={{whiteSpace:'nowrap'}}>⬇ Excel</button>);
  return(<div>
    <div className="report-header"><span className="st">Reports & Analytics</span><span className="report-date">{new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</span></div>
    <div style={{display:'flex',gap:4,marginBottom:18,flexWrap:'wrap'}}>{RTABS.map(t=>(<button key={t.id} onClick={()=>setRTab(t.id)} style={{fontFamily:'var(--mono)',fontSize:10,padding:'7px 12px',borderRadius:6,border:'1px solid',cursor:'pointer',letterSpacing:.5,background:rTab===t.id?'var(--accent)':'transparent',borderColor:rTab===t.id?'var(--accent)':'var(--border2)',color:rTab===t.id?'#fff':'var(--muted)',transition:'all .15s'}}>{t.label}</button>))}</div>

    {rTab==='daily'&&(<div>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:10}}><div style={{flex:1,minWidth:300}}><DateFilter fromDate={fromDate} toDate={toDate} setFromDate={setFromDate} setToDate={setToDate}/></div><div style={{paddingTop:4}}><XlBtn onClick={exportDaily} disabled={dailySummaryRows.length===0}/></div></div>
      <div className="g4 mb14"><div className="card"><div className="ct">Total Tokens</div><div className="stat-n" style={{color:'var(--success)'}}>{dailyToks.length}</div><div className="stat-l">in range</div></div><div className="card"><div className="ct">Total Value</div><div className="stat-n" style={{fontSize:20}}>₹{dailyToks.reduce((s,t)=>s+(t.value||TOKEN_VALUE),0).toLocaleString('en-IN')}</div><div className="stat-l">in range</div></div><div className="card"><div className="ct">Active Days</div><div className="stat-n" style={{color:'var(--purple)'}}>{dailySummaryRows.length}</div><div className="stat-l">with activity</div></div><div className="card"><div className="ct">Avg / Day</div><div className="stat-n" style={{fontSize:20,color:'var(--primary)'}}>{dailySummaryRows.length?Math.round(dailyToks.length/dailySummaryRows.length):0}</div><div className="stat-l">tokens</div></div></div>
      <div className="card"><div className="ct">Day-by-day breakdown</div>{dailySummaryRows.length===0?(<div style={{textAlign:'center',padding:32,color:'var(--muted)',fontSize:13}}>No token activity in selected date range</div>):(<div className="tw"><table><thead><tr><th>Date</th><th>Tokens Assigned</th><th>Total Value</th><th>Employees</th><th>Supervisors</th></tr></thead><tbody>{dailySummaryRows.map(row=>{const ei=[...new Set(row.tokens.map(t=>t.assignedTo))];const si=[...new Set(row.tokens.map(t=>t.assignedBySup).filter(Boolean))];return(<tr key={row.date}><td style={{fontFamily:'var(--mono)',color:'var(--primary)',fontSize:12}}>{row.date}</td><td><span style={{fontFamily:'var(--mono)',color:'var(--success)',fontSize:15}}>{row.total}</span></td><td style={{fontFamily:'var(--mono)',color:'var(--primary)',fontSize:12}}>₹{row.value.toLocaleString('en-IN')}</td><td><span className="badge b-yellow">{ei.length}</span></td><td><span className="badge b-purple">{si.length}</span></td></tr>);})}</tbody></table></div>)}</div>

      <div className="card"><div className="ct">Full token trace</div><div className="tw"><table><thead><tr><th>Token</th><th>Employee</th><th>Supervisor</th><th>Date</th><th>Time</th></tr></thead><tbody>{dateViewToks.length===0&&<tr><td colSpan={5} style={{textAlign:'center',color:'var(--muted)',padding:24}}>No tokens in range</td></tr>}{[...dateViewToks].sort((a,b)=>(b.assignedAt||'').localeCompare(a.assignedAt||'')).map(t=>(<tr key={t.id}><td className="mc" style={{color:'var(--success)'}}>{t.id}</td><td className="mc" style={{color:'var(--primary)'}}>{t.assignedTo}</td><td style={{fontSize:11}}>{t.assignedBy||'—'} <span style={{color:'var(--purple)',fontFamily:'var(--mono)',fontSize:9}}>({t.assignedBySup||'—'})</span></td><td style={{fontSize:10,color:'var(--muted)'}}>{t.lockedDate}</td><td style={{fontSize:10,color:'var(--muted)'}}>{fmtTime(t.assignedAt)}</td></tr>))}</tbody></table></div></div>
