<style>

  --bg:#07070d; --s1:#10101a; --s2:#171724; --s3:#1e1e2e;

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.topbar-r{display:flex;align-items:center;gap:10px}
.rbadge{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:20px;border:1px solid;letter-spacing:1px}
.rbadge.admin{border-color:var(--accent);color:var(--accent)}
.rbadge.supervisor{border-color:var(--accent2);color:var(--accent2)}
.btn-out{font-family:var(--mono);font-size:9px;padding:4px 10px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.btn-out:hover{border-color:var(--danger);color:var(--danger)}
.main{flex:1;padding:22px 20px;max-width:1200px;margin:0 auto;width:100%}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1a1a30 0%,var(--bg) 70%)}
.login-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:360px}
.login-logo{font-family:var(--mono);font-size:24px;color:var(--accent);letter-spacing:3px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:32px}

/* ── FORM ── */

.fg input,.fg select,.fg textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none;transition:border .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}

.fg select option{background:var(--s2)}
.fg textarea{resize:vertical;min-height:70px}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── BUTTONS ── */

/* ── SCANNER ── */

/* ── CAMERA ── */

/* ── VERIFY STATES ── */
.verify-badge{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:var(--r);margin-bottom:14px;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:1px}
.vb-success{background:rgba(61,232,160,.1);border:1px solid var(--accent2);color:var(--accent2)}
.vb-error{background:rgba(240,79,94,.1);border:1px solid var(--danger);color:var(--danger)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}

/* ── SESSION LOG ── */

/* ── TOASTS ── */

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

const TOKEN_VALUE = 100; // ₹ per token

const today = () => new Date().toISOString().split('T')[0];
const nowTs = () => new Date().toISOString();
const fmtTime = (ts) => ts ? new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : '—';
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-IN') : '—';

// ═══════════════════════════════════════════════════
// DB API — Firebase Firestore (persistent)
// ═══════════════════════════════════════════════════
const db = {
  login: async (u, p) => {
    if (u === 'admin' && p === 'admin123')
      return { role: 'admin', name: 'Administrator', id: 'ADMIN' };
    const snap = await firestore.collection('supervisors')
      .where('username', '==', u).where('password', '==', p).where('active', '==', true).get();
    if (snap.empty) throw new Error('Invalid credentials');
    const s = snap.docs[0].data();
    return { role: 'supervisor', name: s.name, id: s.id, qrId: s.qrId };
  },

  loginByQR: async (qrId) => {
    const snap = await firestore.collection('supervisors')
      .where('qrId', '==', qrId.trim().toUpperCase()).where('active', '==', true).get();
    if (snap.empty) throw new Error('Supervisor QR not recognised');
    const s = snap.docs[0].data();
    return { role: 'supervisor', name: s.name, id: s.id, qrId: s.qrId };
  },

  getEmployees: async () => {
    const snap = await firestore.collection('employees').orderBy('name').get();
    return snap.docs.map(d => d.data());
  },

  getEmployeeById: async (id) => {
    const doc = await firestore.collection('employees').doc(id.trim().toUpperCase()).get();
    return doc.exists ? doc.data() : null;
  },

  addEmployee: async (emp) => {
    await firestore.collection('employees').doc(emp.id).set(emp);
  },

  updateEmployee: async (emp) => {
    await firestore.collection('employees').doc(emp.id).set(emp, { merge: true });
  },

  removeEmployee: async (id) => {
    await firestore.collection('employees').doc(id).delete();
  },

  getTokens: async () => {
    const snap = await firestore.collection('tokens').get();
    return snap.docs.map(d => d.data());
  },

  getToken: async (id) => {
    const doc = await firestore.collection('tokens').doc(id.trim().toUpperCase()).get();
    return doc.exists ? doc.data() : null;
  },

  registerToken: async (tok) => {
    await firestore.collection('tokens').doc(tok.id).set(tok);
  },

  updateToken: async (tok) => {
    await firestore.collection('tokens').doc(tok.id).set(tok, { merge: true });
  },

  assignToken: async (tokenId, empId, supId, supName, sessionId) => {
    // Block supervisor QR
    const supSnap = await firestore.collection('supervisors').where('qrId', '==', empId).get();
    if (!supSnap.empty) throw new Error('❌ Supervisor ID detected — cannot assign token');
    const tokRef = firestore.collection('tokens').doc(tokenId);
    const tokDoc = await tokRef.get();
    if (!tokDoc.exists) throw new Error('Token not registered: ' + tokenId + ' — ask admin to register it first');
    const t = tokDoc.data();
    if (t.lockedDate === today()) throw new Error('❌ Token already used today');
    await tokRef.set({
      ...t,
      assignedTo: empId, assignedAt: nowTs(),
      assignedBy: supName, assignedBySup: supId,
      sessionId, lockedDate: today()
    });
    const empRef = firestore.collection('employees').doc(empId);
    await empRef.update({
      tokens: firebase.firestore.FieldValue.arrayUnion(tokenId),
      totalTokens: firebase.firestore.FieldValue.increment(1)
    });
  },

  payEmployee: async (empId) => {
    const empRef = firestore.collection('employees').doc(empId);
    const empDoc = await empRef.get();
    if (!empDoc.exists) throw new Error('Employee not found');
    const e = empDoc.data();
    const tokensPaid = e.totalTokens || 0;
    const amount = tokensPaid * (e.tokenValue || TOKEN_VALUE);
    const txnId = 'TXN' + Date.now();
    await firestore.collection('transactions').doc(txnId).set({
      id: txnId, employeeId: empId, employeeName: e.name,
      tokensPaid, amount, date: today(), timestamp: nowTs()
    });
    const tokSnap = await firestore.collection('tokens').where('assignedTo', '==', empId).get();
    const batch = firestore.batch();
    tokSnap.docs.forEach(d => batch.update(d.ref, {
      assignedTo: null, assignedAt: null, assignedBy: null,
      assignedBySup: null, sessionId: null, lockedDate: null
    }));
    batch.update(empRef, {
      tokens: [], totalTokens: 0,
      paidTokens: firebase.firestore.FieldValue.increment(tokensPaid)
    });
    await batch.commit();
    return { tokensPaid, amount };
  },

  getSupervisors: async () => {
    const snap = await firestore.collection('supervisors').get();
    return snap.docs.map(d => d.data());
  },

  addSupervisor: async (s) => {
    await firestore.collection('supervisors').doc(s.id).set(s);
  },

  updateSupervisor: async (s) => {
    await firestore.collection('supervisors').doc(s.id).set(s, { merge: true });
  },

  removeSupervisor: async (id) => {
    await firestore.collection('supervisors').doc(id).delete();
  },

  getTransactions: async () => {
    const snap = await firestore.collection('transactions').orderBy('timestamp', 'desc').get();
    return snap.docs.map(d => d.data());
  },

  universalScan: async (qr) => {
    const val = qr.trim().toUpperCase();
    const empDoc = await firestore.collection('employees').doc(val).get();
    if (empDoc.exists) return { type: 'employee', data: empDoc.data() };
    const supSnap = await firestore.collection('supervisors').where('qrId', '==', val).get();
    if (!supSnap.empty) {
      const s = supSnap.docs[0].data();
      const tokSnap = await firestore.collection('tokens').where('assignedBySup', '==', s.id).get();
      return { type: 'supervisor', data: { ...s, totalAssigned: tokSnap.size } };
    }
    const tokDoc = await firestore.collection('tokens').doc(val).get();
    if (tokDoc.exists) {
      const t = tokDoc.data();
      let employee = null;
      if (t.assignedTo) {
        const ed = await firestore.collection('employees').doc(t.assignedTo).get();
        if (ed.exists) employee = ed.data();
      }
      return { type: 'token', data: { ...t, employee } };
    }
    return { type: 'unknown', data: { qr: val } };
  },

function useToast(){
  const[toasts,setToasts]=useState([]);
  const show=(msg,type='info')=>{const id=Date.now();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500);};
  return{toasts,show};
}

function CamScanner({onScan,onClose,label=''}){
  const vidRef=useRef();const canRef=useRef();const streamRef=useRef();const animRef=useRef();
  const[status,setStatus]=useState('Starting camera...');
  const[camErr,setCamErr]=useState(null);
  const lastRef=useRef('');
  useEffect(()=>{
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
      streamRef.current=stream;
      if(vidRef.current){vidRef.current.srcObject=stream;vidRef.current.play();setStatus(label||'Point at QR code...');}
      animRef.current=requestAnimationFrame(tick);
    }).catch(()=>setCamErr('Camera access denied. Use manual input below.'));
    return()=>{streamRef.current?.getTracks().forEach(t=>t.stop());cancelAnimationFrame(animRef.current);};
  },[]);
  const tick=()=>{
    const v=vidRef.current,c=canRef.current;
    if(v&&c&&v.readyState===v.HAVE_ENOUGH_DATA){
      c.width=v.videoWidth;c.height=v.videoHeight;
      c.getContext('2d').drawImage(v,0,0);
      const img=c.getContext('2d').getImageData(0,0,c.width,c.height);
      const code=window.jsQR&&window.jsQR(img.data,img.width,img.height);
      if(code&&code.data&&code.data!==lastRef.current){
        lastRef.current=code.data;setStatus('✓ Scanned: '+code.data);
        onScan(code.data);
        setTimeout(()=>{lastRef.current='';setStatus(label||'Ready for next scan...');},2000);
      }
    }
    animRef.current=requestAnimationFrame(tick);
  };
  return(
    <div>
      <div className="cam-wrap">
        {camErr?<div style={{padding:32,textAlign:'center',color:'var(--danger)',fontSize:13}}>{camErr}</div>:(
          <>
            <video ref={vidRef} playsInline muted style={{width:'100%',maxHeight:240,objectFit:'cover',display:'block'}}/>
            <canvas ref={canRef} style={{display:'none'}}/>
            <div className="cam-frame"/><div className="cam-line"/>
            <div className="cam-foot">{status}</div>
          </>
        )}
      </div>
      <button className="btn btn-danger btn-sm" onClick={onClose}>✕ Close camera</button>
    </div>
  );
}

// LOGIN
// ═══════════════════════════════════════════════════
function Login({onLogin}){
  const[u,setU]=useState('');
  const[p,setP]=useState('');
  const[err,setErr]=useState('');
  const[busy,setBusy]=useState(false);
  const[camOpen,setCamOpen]=useState(false);
  const[qrUser,setQrUser]=useState(null); // supervisor identified by QR — still needs password
  const pRef=useRef();

  const go=async()=>{
    if(!u||!p){setErr('Enter username and password');return;}
    setBusy(true);setErr('');
    try{onLogin(await db.login(u.trim(),p));}
    catch(e){setErr(e.message);}finally{setBusy(false);}
  };

  // QR scan identifies the supervisor — then ask for password
  const handleQR=async(val)=>{
    setCamOpen(false);setErr('');
    try{
      // Just look up who this QR belongs to, don't log in yet
      const snap=await firestore.collection('supervisors').where('qrId','==',val.trim().toUpperCase()).where('active','==',true).get();
      if(snap.empty){setErr('Supervisor QR not recognised');return;}
      const s=snap.docs[0].data();
      setQrUser(s);
      setU(s.username);
      setP('');
      setTimeout(()=>pRef.current?.focus(),200);
    }catch(e){setErr(e.message);}
  };

  const goQR=async()=>{
    if(!p){setErr('Enter your password');return;}
    setBusy(true);setErr('');
    try{onLogin(await db.login(qrUser.username,p));}
    catch(e){setErr('Wrong password');setP('');}
    finally{setBusy(false);}
  };

  return(
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">⬡ TOKENPAY</div>
        <div className="login-sub">Workforce Token System v5</div>

        {/* QR identified — just ask password */}
        {qrUser?(
          <>
            <div className="verify-badge vb-success pop" style={{marginBottom:18}}>
              🔑 {qrUser.name}
            </div>
            <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:12,textAlign:'center',letterSpacing:1}}>
              QR ID: {qrUser.qrId} — Enter your password to continue
            </div>
            <div className="fg">
              <label>Password</label>
              <input ref={pRef} type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&goQR()} placeholder="••••••••" autoFocus/>
            </div>
            <button className="btn btn-primary btn-full" onClick={goQR} disabled={busy} style={{marginBottom:10}}>
              {busy?'Signing in...':'Sign In →'}
            </button>
            <button className="btn btn-ghost btn-full" onClick={()=>{setQrUser(null);setU('');setP('');setErr('');}}>
              ↩ Back
            </button>
          </>
        ):camOpen?(
          <CamScanner onScan={handleQR} onClose={()=>setCamOpen(false)} label="Scan supervisor QR card..."/>
        ):(
          <>
            <div className="fg"><label>Username</label><input value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} placeholder="admin or supervisor username" autoFocus/></div>
            <div className="fg"><label>Password</label><input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} placeholder="••••••••"/></div>
            <button className="btn btn-primary btn-full" onClick={go} disabled={busy} style={{marginBottom:10}}>{busy?'Signing in...':'Sign In'}</button>
            <button className="btn btn-ghost btn-full" onClick={()=>setCamOpen(true)}>📷 Scan Supervisor QR Card</button>
          </>
        )}
        {err&&<div className="err-msg">{err}</div>}
      </div>
    </div>
  );
}

        value:Number(form.value),
        assignedTo:null,assignedAt:null,
        assignedBy:null,assignedBySup:null,
        sessionId:null,lockedDate:null,
        registeredAt:nowTs()
      });
      toast.show('Token registered: '+form.id,'success');
      onSaved();onClose();
    }catch(e){toast.show(e.message,'error');}finally{setBusy(false);}
  };

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">🎟️ Register New Token</div>

        <div style={{marginBottom:16}}>
          <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',letterSpacing:1.5,textTransform:'uppercase',marginBottom:8}}>Step 1 — Scan Token QR *</div>

            <div className="verify-badge vb-success pop">✓ Token QR: {form.id}</div>
          ):camOpen?(
            <CamScanner onScan={handleQRScan} onClose={()=>setCamOpen(false)} label="Scan token QR..."/>
          ):(
            <div className="scanbox">
              <div className="scan-icon">🎟️</div>
              <div className="scan-hint">Scan the physical token QR card to register it in the system.</div>
              <input className="scan-input" placeholder="Or type token ID (e.g. TKN000001)"
                onKeyDown={e=>e.key==='Enter'&&handleQRScan(e.target.value)}
              />
              <div style={{display:'flex',gap:8,justifyContent:'center',marginTop:12}}>
                <button className="btn btn-success btn-sm" onClick={()=>setCamOpen(true)}>📷 Scan Token QR</button>
                <button className="btn btn-ghost btn-sm" onClick={e=>{
                  const v=e.target.closest('.scanbox').querySelector('input').value;
                  if(v.trim()) handleQRScan(v.trim());

                }}>→ Use typed value</button>
              </div>
            </div>
          )}
          {qrScanned&&(
            <div style={{textAlign:'center',marginTop:6}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>{setQrScanned(false);setForm(f=>({...f,id:''}));}}>↩ Re-scan</button>
            </div>
          )}

        <div style={{opacity:qrScanned?1:.4,pointerEvents:qrScanned?'auto':'none',transition:'opacity .2s'}}>

          <div className="fg"><label>Token ID (auto-filled)</label><input value={form.id} readOnly style={{background:'var(--s3)',color:'var(--accent2)'}}/></div>
          <div className="fg">
            <label>Token Value (₹) *</label>
            <input type="number" value={form.value} onChange={e=>setForm({...form,value:e.target.value})} placeholder="100" min="1"/>
            <div style={{fontSize:10,color:'var(--muted)',marginTop:4}}>Default ₹{TOKEN_VALUE} per token. Change only if this token has a different value.</div>
          </div>
        </div>

        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={save} disabled={busy||!qrScanned}>{busy?'Saving...':'✓ Register Token'}</button>
        </div>
      </div>
    </div>
  );
}


function PayoutModal({emp,onClose,onDone,toast}){
  const[busy,setBusy]=useState(false);

      toast.show(`✓ Paid ₹${res.amount} for ${res.tokensPaid} tokens to ${emp.name}`,'success');
      onDone();onClose();
    }catch(e){toast.show(e.message,'error');}finally{setBusy(false);}

  return(
    <div className="overlay" onClick={onClose}>

  );
}

// REPORTS PANEL — Full featured with date filters
// ═══════════════════════════════════════════════════
function ReportsPanel({tokens,employees,supervisors,transactions}){
  const[rTab,setRTab]=useState('daily');
  const[fromDate,setFromDate]=useState(today());
  const[toDate,setToDate]=useState(today());
  const[selEmp,setSelEmp]=useState('');
  const[selSup,setSelSup]=useState('');
  const[txFromDate,setTxFromDate]=useState('');
  const[txToDate,setTxToDate]=useState('');

  // ── helpers ──
  const inRange=(date,from,to)=>{
    if(!date) return false;
    if(from&&date<from) return false;
    if(to&&date>to) return false;
    return true;
  };

  // ── DAILY SUMMARY ──
  const dailyToks=tokens.filter(t=>t.lockedDate&&inRange(t.lockedDate,fromDate,toDate));
  // group by date
  const byDate={};
  dailyToks.forEach(t=>{
    const d=t.lockedDate;
    if(!byDate[d]) byDate[d]={date:d,tokens:[],total:0,value:0};
    byDate[d].tokens.push(t);
    byDate[d].total++;
    byDate[d].value+=(t.value||TOKEN_VALUE);
  });
  const dailySummaryRows=Object.values(byDate).sort((a,b)=>b.date.localeCompare(a.date));

  // ── DATE VIEW — everything on selected date range ──
  const dateViewToks=tokens.filter(t=>t.lockedDate&&inRange(t.lockedDate,fromDate,toDate));
  const dateViewByEmp={};
  dateViewToks.forEach(t=>{
    if(!dateViewByEmp[t.assignedTo]) dateViewByEmp[t.assignedTo]={empId:t.assignedTo,tokens:[],value:0};
    dateViewByEmp[t.assignedTo].tokens.push(t);
    dateViewByEmp[t.assignedTo].value+=(t.value||TOKEN_VALUE);
  });
  const dateViewRows=Object.values(dateViewByEmp).map(row=>{
    const emp=employees.find(e=>e.id===row.empId);
    return{...row,empName:emp?emp.name:'Unknown'};
  }).sort((a,b)=>b.tokens.length-a.tokens.length);

  // ── EMPLOYEE VIEW — per employee full history ──
  const empToks=tokens.filter(t=>t.assignedTo&&(!selEmp||t.assignedTo===selEmp));
  const empHistory=employees
    .filter(e=>!selEmp||e.id===selEmp)
    .map(e=>{
      const toks=empToks.filter(t=>t.assignedTo===e.id);
      const totalValue=toks.reduce((s,t)=>s+(t.value||TOKEN_VALUE),0);
      const txns=transactions.filter(t=>t.employeeId===e.id);
      const totalPaid=txns.reduce((s,t)=>s+t.amount,0);
      return{...e,assignedToks:toks,totalValue,txns,totalPaid};
    })
    .filter(e=>e.assignedToks.length>0||selEmp);

  // ── SUPERVISOR VIEW ──
  const supToks=tokens.filter(t=>t.assignedBySup&&inRange(t.lockedDate,fromDate,toDate)&&(!selSup||t.assignedBySup===selSup));
  const supByDate={};
  supToks.forEach(t=>{
    const key=`${t.assignedBySup}__${t.lockedDate}`;
    if(!supByDate[key]) supByDate[key]={supId:t.assignedBySup,supName:t.assignedBy,date:t.lockedDate,count:0,value:0};
    supByDate[key].count++;
    supByDate[key].value+=(t.value||TOKEN_VALUE);
  });
  const supRows=Object.values(supByDate).sort((a,b)=>b.date.localeCompare(a.date)||b.count-a.count);
  const supTotals=supervisors.map(s=>{
    const rows=supRows.filter(r=>r.supId===s.id);
    return{...s,periodCount:rows.reduce((x,r)=>x+r.count,0),periodValue:rows.reduce((x,r)=>x+r.value,0)};
  }).filter(s=>s.periodCount>0||!selSup);

  // ── PAYOUT HISTORY ──
  const filteredTxns=transactions.filter(t=>inRange(t.date,txFromDate||'2020-01-01',txToDate||'2099-12-31'));
  const txTotal=filteredTxns.reduce((s,t)=>s+t.amount,0);
  const txTokens=filteredTxns.reduce((s,t)=>s+t.tokensPaid,0);

  const RTABS=[
    {id:'daily',label:'📅 Daily Summary'},
    {id:'date',label:'📆 By Date'},
    {id:'employee',label:'👤 By Employee'},
    {id:'supervisor',label:'⚡ Supervisor'},
    {id:'payout',label:'💰 Payout History'},
  ];

  const DateFilter=()=>(
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',marginBottom:16,padding:'12px 14px',background:'var(--s2)',borderRadius:8}}>
      <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',letterSpacing:1}}>DATE RANGE</div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)}
          style={{background:'var(--s3)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 8px',color:'var(--text)',fontFamily:'var(--mono)',fontSize:11}}/>
        <span style={{color:'var(--muted)',fontSize:11}}>to</span>
        <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}
          style={{background:'var(--s3)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 8px',color:'var(--text)',fontFamily:'var(--mono)',fontSize:11}}/>
      </div>
      <button className="btn btn-ghost btn-sm" onClick={()=>{setFromDate(today());setToDate(today());}}>Today</button>
      <button className="btn btn-ghost btn-sm" onClick={()=>{
        const d=new Date();d.setDate(d.getDate()-6);
        setFromDate(d.toISOString().split('T')[0]);setToDate(today());
      }}>Last 7 days</button>
      <button className="btn btn-ghost btn-sm" onClick={()=>{
        const d=new Date();d.setDate(1);
        setFromDate(d.toISOString().split('T')[0]);setToDate(today());
      }}>This month</button>
    </div>
  );

  return(
    <div>
      <div className="report-header">
        <span className="st">Reports & Analytics</span>

                    </div>

            ))
          )}

      {/* ── SUPERVISOR WISE ── */}
      {rTab==='supervisor'&&(
        <div>
          <DateFilter/>

            <select value={selSup} onChange={e=>setSelSup(e.target.value)}
              style={{background:'var(--s3)',border:'1px solid var(--border)',borderRadius:6,padding:'6px 10px',color:'var(--text)',fontSize:12,minWidth:200}}>
              <option value=''>All Supervisors</option>
              {supervisors.map(s=><option key={s.id} value={s.id}>{s.name} ({s.id})</option>)}
            </select>
            {selSup&&<button className="btn btn-ghost btn-sm" onClick={()=>setSelSup('')}>✕ Clear</button>}
          </div>
          {/* Supervisor totals for period */}
          <div className="card mb14">
            <div className="ct">Supervisor performance — {fromDate} to {toDate}</div>
            <div className="tw">
              <table>
                <thead><tr><th>Supervisor</th><th>ID</th><th>Tokens Assigned</th><th>Total Value</th></tr></thead>
                <tbody>
                  {supTotals.length===0&&<tr><td colSpan={4} style={{textAlign:'center',color:'var(--muted)',padding:24}}>No activity in range</td></tr>}
                  {supTotals.map(s=>(
                    <tr key={s.id}>
                      <td><div style={{display:'flex',alignItems:'center',gap:8}}><div className="avt avt-p" style={{width:26,height:26,fontSize:10}}>{s.name.charAt(0)}</div>{s.name}</div></td>
                      <td className="mc" style={{color:'var(--accent3)'}}>{s.id}</td>
                      <td><span style={{fontFamily:'var(--mono)',color:'var(--accent2)',fontSize:15}}>{s.periodCount}</span></td>
                      <td style={{fontFamily:'var(--mono)',color:'var(--accent)',fontSize:12}}>₹{s.periodValue.toLocaleString('en-IN')}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          {/* Day-by-day supervisor breakdown */}
          <div className="card">
            <div className="ct">Day-by-day supervisor log</div>
            <div className="tw">
              <table>
                <thead><tr><th>Date</th><th>Supervisor</th><th>ID</th><th>Tokens</th><th>Value</th></tr></thead>
                <tbody>
                  {supRows.length===0&&<tr><td colSpan={5} style={{textAlign:'center',color:'var(--muted)',padding:24}}>No activity in range</td></tr>}
                  {supRows.map((row,i)=>(
                    <tr key={i}>
                      <td style={{fontFamily:'var(--mono)',color:'var(--accent)',fontSize:11}}>{row.date}</td>
                      <td>{row.supName||row.supId}</td>

                      <td><span style={{fontFamily:'var(--mono)',color:'var(--accent2)'}}>{row.count}</span></td>
                      <td style={{fontFamily:'var(--mono)',color:'var(--accent)',fontSize:11}}>₹{row.value.toLocaleString('en-IN')}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

      )}

      {/* ── PAYOUT HISTORY ── */}
      {rTab==='payout'&&(
        <div>
          <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',marginBottom:16,padding:'12px 14px',background:'var(--s2)',borderRadius:8}}>

          <div className="g3 mb14">

            <div className="card"><div className="ct">Tokens Paid</div><div className="stat-n" style={{color:'var(--accent2)'}}>{txTokens}</div><div className="stat-l">total</div></div>

          </div>

            <div className="ct">Payment records</div>
            {filteredTxns.length===0?(
              <div style={{textAlign:'center',padding:32,color:'var(--muted)',fontSize:13}}>No transactions in selected range</div>
            ):(
              <div className="tw">
                <table>
                  <thead><tr><th>Txn ID</th><th>Employee</th><th>ID</th><th>Tokens Paid</th><th>Amount</th><th>Date</th><th>Time</th></tr></thead>
                  <tbody>
                    {filteredTxns.map(t=>(
                      <tr key={t.id}>
                        <td className="mc" style={{fontSize:9,color:'var(--muted2)'}}>{t.id}</td>

                        <td style={{fontSize:10,color:'var(--muted)'}}>{t.date}</td>
                        <td style={{fontSize:10,color:'var(--muted)'}}>{fmtTime(t.timestamp)}</td>

                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ADMIN DASHBOARD
// ═══════════════════════════════════════════════════
function AdminDashboard({user,toast}){
  const[tab,setTab]=useState('overview');
  const[employees,setEmployees]=useState([]);
  const[tokens,setTokens]=useState([]);
  const[supervisors,setSupervisors]=useState([]);
  const[transactions,setTransactions]=useState([]);
  const[showAddEmp,setShowAddEmp]=useState(false);
  const[showAddSup,setShowAddSup]=useState(false);
  const[showScan,setShowScan]=useState(false);
  const[showRegToken,setShowRegToken]=useState(false);
  const[editSup,setEditSup]=useState(null);
  const[editEmp,setEditEmp]=useState(null);
  const[editTok,setEditTok]=useState(null);
  const[payoutEmp,setPayoutEmp]=useState(null);
  const[searchEmp,setSearchEmp]=useState('');
  const[searchTok,setSearchTok]=useState('');
  const[tokResult,setTokResult]=useState(null);

  const load=async()=>{
    const[e,t,s,tx]=await Promise.all([db.getEmployees(),db.getTokens(),db.getSupervisors(),db.getTransactions()]);
    setEmployees(e);setTokens(t);setSupervisors(s);setTransactions(tx);
  };
  useEffect(()=>{load();},[]);

  const assigned=tokens.filter(t=>t.assignedTo).length;
  const totalToks=employees.reduce((s,e)=>s+(e.totalTokens||0),0);
  const totalPaid=transactions.reduce((s,t)=>s+t.amount,0);

  const handleRemoveEmp=async(id,name)=>{
    if(!window.confirm(`Remove employee ${name}? This cannot be undone.`)) return;
    await db.removeEmployee(id);toast.show('Employee removed','info');load();
  };
  const handleRemoveSup=async(id,name)=>{
    if(!window.confirm(`Remove supervisor ${name}?`)) return;
    await db.removeSupervisor(id);toast.show('Supervisor removed','info');load();
  };
  const handleTokSearch=async()=>{
    if(!searchTok.trim()) return;
    const t=await db.getToken(searchTok.trim().toUpperCase());
    if(!t){setTokResult({error:'Token not found'});return;}
    if(!t.assignedTo){setTokResult({status:'free',token:t});return;}
    const emp=await db.getEmployeeById(t.assignedTo);
    setTokResult({status:'assigned',token:t,employee:emp});
  };

  const fEmps=employees.filter(e=>
    e.name.toLowerCase().includes(searchEmp.toLowerCase())||
    e.id.toLowerCase().includes(searchEmp.toLowerCase())||
    (e.mobile||'').includes(searchEmp)
  );

  // ── REPORTS DATA now handled inside ReportsPanel ──
  const todayTokens=tokens.filter(t=>t.lockedDate===today());
  const TABS=['overview','employees','supervisors','tokens','register-tokens','token-search','reports','payout'];

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <div/>
        <button className="btn btn-ghost btn-sm" onClick={()=>setShowScan(true)}>🔍 Universal Scan</button>
      </div>
      <div className="tabs">
        {TABS.map(t=>(
          <button key={t} className={`tab ${tab===t?'active':''}`} onClick={()=>setTab(t)}>
            {t.replace('-',' ')}
          </button>
        ))}
      </div>

      {/* ── OVERVIEW ── */}
      {tab==='overview'&&(
        <>
          <div className="g4 mb14">
            <div className="card"><div className="ct">Employees</div><div className="stat-n">{employees.length}</div><div className="stat-l">registered</div></div>
            <div className="card"><div className="ct">Supervisors</div><div className="stat-n" style={{color:'var(--accent3)'}}>{supervisors.length}</div><div className="stat-l">active</div></div>
            <div className="card"><div className="ct">Tokens Pending</div><div className="stat-n" style={{color:'var(--accent2)'}}>{totalToks}</div><div className="stat-l">this period</div></div>
            <div className="card"><div className="ct">Total Paid Out</div><div className="stat-n" style={{color:'var(--accent)'}}>₹{totalPaid.toLocaleString('en-IN')}</div><div className="stat-l">all time</div></div>
          </div>
          <div className="g2">
            <div className="card">
              <div className="ct">Top earners — current period</div>
              {[...employees].sort((a,b)=>(b.totalTokens||0)-(a.totalTokens||0)).slice(0,6).map(e=>(
                <div key={e.id} className="erow" style={{cursor:'default'}}>
                  <div className="avt avt-y">{e.name.charAt(0)}</div>
                  <div className="ei"><div className="en">{e.name}</div><div className="er">{e.id}</div></div>
                  <div><div className="etok">{e.totalTokens||0}</div><div className="etl">tokens</div></div>
                </div>
              ))}
            </div>
            <div className="card">
              <div className="ct">Today's activity</div>
              <div className="g2" style={{marginBottom:12}}>
                <div style={{padding:12,background:'var(--s2)',borderRadius:8,textAlign:'center'}}>
                  <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:4}}>TODAY TOKENS</div>
                  <div style={{fontFamily:'var(--mono)',fontSize:24,color:'var(--accent2)'}}>{todayTokens.length}</div>
                </div>
                <div style={{padding:12,background:'var(--s2)',borderRadius:8,textAlign:'center'}}>
                  <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:4}}>TODAY TXN</div>
                  <div style={{fontFamily:'var(--mono)',fontSize:24,color:'var(--accent)'}}>{transactions.filter(t=>t.date===today()).length}</div>
                </div>
              </div>
              {transactions.slice(-3).reverse().map(t=>(
                <div key={t.id} className="slog-item">
                  <span style={{fontSize:12}}>{t.employeeName}</span>
                  <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--accent2)'}}>₹{t.amount.toLocaleString('en-IN')}</span>
                </div>
              ))}
              {transactions.length===0&&<div style={{textAlign:'center',padding:20,color:'var(--muted)',fontSize:12}}>No transactions yet</div>}
            </div>
          </div>
        </>
      )}

      {/* ── EMPLOYEES ── */}
      {tab==='employees'&&(
        <>
          <div className="sh mb14">
            <span className="st">Employee Profiles ({employees.length})</span>
            <button className="btn btn-success btn-sm" onClick={()=>setShowAddEmp(true)}>+ Register Employee</button>
          </div>
          <div className="card">
            <div className="sbar"><input value={searchEmp} onChange={e=>setSearchEmp(e.target.value)} placeholder="Search name, EMP ID, mobile..."/></div>
            <div className="tw">
              <table>
                <thead><tr><th>Employee</th><th>ID</th><th>Mobile</th><th>Pending Tokens</th><th>Lifetime Paid</th><th>Payable</th><th>Actions</th></tr></thead>
                <tbody>
                  {fEmps.map(e=>(
                    <tr key={e.id}>
                      <td><div style={{display:'flex',alignItems:'center',gap:8}}><div className="avt avt-y" style={{width:28,height:28,fontSize:10}}>{e.name.charAt(0)}</div>{e.name}</div></td>
                      <td className="mc" style={{color:'var(--accent)'}}>{e.id}</td>
                      <td className="mc" style={{color:'var(--muted2)'}}>{e.mobile||'—'}</td>
                      <td><span style={{fontFamily:'var(--mono)',color:'var(--accent2)'}}>{e.totalTokens||0}</span></td>
                      <td className="mc" style={{color:'var(--muted2)'}}>{e.paidTokens||0}</td>
                      <td style={{fontFamily:'var(--mono)',color:'var(--accent)',fontSize:12}}>₹{((e.totalTokens||0)*TOKEN_VALUE).toLocaleString('en-IN')}</td>
                      <td>
                        <div style={{display:'flex',gap:6}}>
                          <button className="btn btn-ghost btn-sm" onClick={()=>setEditEmp(e)}>✏️ Edit</button>
                          <button className="btn btn-warn btn-sm" onClick={()=>setPayoutEmp(e)}>Pay & Reset</button>
                          <button className="btn btn-danger btn-sm" onClick={()=>handleRemoveEmp(e.id,e.name)}>Remove</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}

      {/* ── SUPERVISORS ── */}
      {tab==='supervisors'&&(
        <>
          <div className="sh mb14">
            <span className="st">Supervisor Accounts ({supervisors.length})</span>
            <button className="btn btn-success btn-sm" onClick={()=>setShowAddSup(true)}>+ Register Supervisor</button>
          </div>
          <div className="card">
            <div className="tw">
              <table>
                <thead><tr><th>Name</th><th>ID</th><th>Mobile</th><th>Username</th><th>QR ID</th><th>Tokens Assigned</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                  {supervisors.map(s=>{
                    const assigned=tokens.filter(t=>t.assignedBySup===s.id).length;
                    return(
                      <tr key={s.id}>
                        <td><div style={{display:'flex',alignItems:'center',gap:8}}><div className="avt avt-p" style={{width:28,height:28,fontSize:10}}>{s.name.charAt(0)}</div>{s.name}</div></td>
                        <td className="mc" style={{color:'var(--accent3)'}}>{s.id}</td>
                        <td className="mc" style={{color:'var(--muted2)'}}>{s.mobile||'—'}</td>
                        <td className="mc">{s.username}</td>
                        <td className="mc" style={{color:'var(--accent3)',fontSize:10}}>{s.qrId}</td>
                        <td><span style={{fontFamily:'var(--mono)',color:'var(--accent2)'}}>{assigned}</span></td>
                        <td><span className="badge b-green">Active</span></td>
                        <td>
                          <div style={{display:'flex',gap:6}}>
                            <button className="btn btn-ghost btn-sm" onClick={()=>setEditSup(s)}>✏️ Edit</button>
                            <button className="btn btn-danger btn-sm" onClick={()=>handleRemoveSup(s.id,s.name)}>Remove</button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}

      {/* ── TOKENS ── */}
      {tab==='tokens'&&(
        <div className="card">
          <div className="sh">
            <span className="st">Token Pool ({tokens.length})</span>
            <span className="badge b-yellow">{assigned} assigned</span>
          </div>
          <div className="sbar"><input value={searchTok} onChange={e=>{setSearchTok(e.target.value);setTokResult(null);}} placeholder="Search token ID or employee ID..."/></div>
          <div className="tw">
            <table>
              <thead><tr><th>Token</th><th>Status</th><th>Employee</th><th>Assigned By</th><th>Date</th><th>Time</th></tr></thead>
              <tbody>
                {tokens.filter(t=>
                  t.id.includes(searchTok.toUpperCase())||
                  (t.assignedTo||'').includes(searchTok.toUpperCase())
                ).slice(0,80).map(t=>(
                  <tr key={t.id}>
                    <td className="mc">{t.id}</td>
                    <td><span className={`badge ${t.assignedTo?'b-green':'b-gray'}`}>{t.assignedTo?'Assigned':'Free'}</span></td>
                    <td className="mc" style={{color:'var(--accent)'}}>{t.assignedTo||'—'}</td>
                    <td style={{fontSize:11,color:'var(--muted2)'}}>{t.assignedBy||'—'}</td>
                    <td style={{fontSize:10,color:'var(--muted)'}}>{t.lockedDate||'—'}</td>
                    <td style={{fontSize:10,color:'var(--muted)'}}>{t.assignedAt?fmtTime(t.assignedAt):'—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* ── REGISTER TOKENS ── */}
      {tab==='register-tokens'&&(
        <div>
          <div className="sh mb14">
            <span className="st">Token Registry ({tokens.length} registered)</span>
            <button className="btn btn-success btn-sm" onClick={()=>setShowRegToken(true)}>+ Register Token</button>
          </div>
          <div className="verify-badge vb-info mb14" style={{justifyContent:'flex-start',gap:8}}>
            🎟️ Register each physical token QR card here before supervisors can assign them. Set the value per token (default ₹{TOKEN_VALUE}).
          </div>
          <div className="card">
            <div className="tw">
              <table>
                <thead><tr><th>Token ID</th><th>Value (₹)</th><th>Status</th><th>Assigned To</th><th>Assigned By</th><th>Date</th><th>Action</th></tr></thead>
                <tbody>
                  {tokens.length===0&&(
                    <tr><td colSpan={7} style={{textAlign:'center',color:'var(--muted)',padding:32}}>No tokens registered yet. Click "+ Register Token" to add.</td></tr>
                  )}
                  {[...tokens].reverse().map(t=>(
                    <tr key={t.id}>
                      <td className="mc" style={{color:'var(--accent2)'}}>{t.id}</td>
                      <td style={{fontFamily:'var(--mono)',color:'var(--accent)'}}>₹{t.value||TOKEN_VALUE}</td>
                      <td><span className={`badge ${t.assignedTo?'b-green':'b-gray'}`}>{t.assignedTo?'Assigned':'Free'}</span></td>
                      <td className="mc" style={{color:'var(--accent)'}}>{t.assignedTo||'—'}</td>
                      <td style={{fontSize:11,color:'var(--muted2)'}}>{t.assignedBy||'—'}</td>
                      <td style={{fontSize:10,color:'var(--muted)'}}>{t.lockedDate||'—'}</td>
                      <td><button className="btn btn-ghost btn-sm" onClick={()=>setEditTok(t)}>✏️ Edit</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* ── TOKEN SEARCH ── */}
      {tab==='token-search'&&(
        <TokenSearchPanel toast={toast}/>
      )}

      {/* ── REPORTS ── */}
      {tab==='reports'&&(
        <ReportsPanel tokens={tokens} employees={employees} supervisors={supervisors} transactions={transactions}/>
      )}

      {/* ── PAYOUT ── */}
      {tab==='payout'&&(
        <div>
          <div className="sh mb14">
            <span className="st">Payout Panel</span>
            <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--muted)'}}>₹{TOKEN_VALUE}/token</span>
          </div>
          <div className="g2 mb14">
            {employees.filter(e=>(e.totalTokens||0)>0).length===0&&(
              <div className="card" style={{gridColumn:'1/-1',textAlign:'center',padding:40,color:'var(--muted)'}}>
                No employees with pending tokens
              </div>
            )}
            {employees.filter(e=>(e.totalTokens||0)>0).sort((a,b)=>b.totalTokens-a.totalTokens).map(e=>(
              <div key={e.id} className="card" style={{borderColor:'rgba(61,232,160,.2)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div className="avt avt-y">{e.name.charAt(0)}</div>
                    <div>
                      <div style={{fontWeight:600}}>{e.name}</div>
                      <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--accent)',marginTop:2}}>{e.id}</div>
                    </div>
                  </div>
                  <span className="badge b-green">{e.totalTokens} tokens</span>
                </div>
                <div className="payout-box" style={{padding:14,marginBottom:12}}>
                  <div style={{fontSize:11,color:'var(--muted)'}}>Payable Amount</div>
                  <div style={{fontFamily:'var(--mono)',fontSize:26,color:'var(--accent2)',lineHeight:1.2}}>₹{((e.totalTokens||0)*TOKEN_VALUE).toLocaleString('en-IN')}</div>
                </div>
                <button className="btn btn-warn btn-full btn-sm" onClick={()=>setPayoutEmp(e)}>PAY & RESET →</button>
              </div>
            ))}
          </div>

          {/* Payment History */}
          <div className="card">
            <div className="ct">Payment History ({transactions.length})</div>
            {transactions.length===0?(
              <div style={{textAlign:'center',padding:24,color:'var(--muted)',fontSize:12}}>No transactions yet</div>
            ):(
              <div className="tw">
                <table>
                  <thead><tr><th>Txn ID</th><th>Employee</th><th>ID</th><th>Tokens Paid</th><th>Amount</th><th>Date</th></tr></thead>
                  <tbody>
                    {[...transactions].reverse().map(t=>(
                      <tr key={t.id}>
                        <td className="mc" style={{fontSize:10,color:'var(--muted2)'}}>{t.id}</td>
                        <td>{t.employeeName}</td>
                        <td className="mc" style={{color:'var(--accent)'}}>{t.employeeId}</td>
                        <td><span style={{fontFamily:'var(--mono)',color:'var(--accent2)'}}>{t.tokensPaid}</span></td>
                        <td style={{fontFamily:'var(--mono)',color:'var(--accent)',fontSize:13}}>₹{t.amount.toLocaleString('en-IN')}</td>
                        <td style={{fontSize:11,color:'var(--muted)'}}>{t.date}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── MODALS ── */}
      {showAddEmp&&<AddEmployeeModal onClose={()=>setShowAddEmp(false)} onSaved={load} toast={toast}/>}
      {showAddSup&&<AddSupervisorModal onClose={()=>setShowAddSup(false)} onSaved={load} toast={toast}/>}
      {showScan&&<UniversalScanModal onClose={()=>setShowScan(false)} toast={toast}/>}
      {showRegToken&&<RegisterTokenModal onClose={()=>setShowRegToken(false)} onSaved={load} toast={toast}/>}
      {editEmp&&<EditEmployeeModal emp={editEmp} onClose={()=>setEditEmp(null)} onSaved={load} toast={toast}/>}
      {editTok&&<EditTokenModal tok={editTok} onClose={()=>setEditTok(null)} onSaved={load} toast={toast}/>}
      {editSup&&<EditSupervisorModal sup={editSup} onClose={()=>setEditSup(null)} onSaved={load} toast={toast}/>}
      {payoutEmp&&<PayoutModal emp={payoutEmp} onClose={()=>setPayoutEmp(null)} onDone={load} toast={toast}/>}
    </div>
  );
}

// SUPERVISOR PANEL
// ═══════════════════════════════════════════════════
function SupervisorPanel({user,toast}){
  const[employees,setEmployees]=useState([]);
  const[step,setStep]=useState('verify'); // verify | tokens
  const[verifiedEmp,setVerifiedEmp]=useState(null);
  const[sessionTokens,setSessionTokens]=useState([]);
  const[sessionId]=useState(`SES-${Date.now()}`);
  const[empSearch,setEmpSearch]=useState('');
  const[empCam,setEmpCam]=useState(false);
  const[empManual,setEmpManual]=useState('');
  const[tokCam,setTokCam]=useState(false);
  const[tokManual,setTokManual]=useState('');
  const[tokBusy,setTokBusy]=useState(false);
  const tokInputRef=useRef();

  useEffect(()=>{db.getEmployees().then(setEmployees);},[]);

  // ── STEP 1: verify employee — exact QR match ──
  const verifyEmployee=async(raw)=>{
    setEmpCam(false);
    const val=raw.trim().toUpperCase();

    // Block supervisor QR — check by qrId (exact match what was scanned)
    const allSups=await db.getSupervisors();
    const isSup=allSups.find(s=>s.qrId===val||s.id===val);
    if(isSup){
      toast.show('❌ Supervisor QR detected — cannot use as employee','error');
      setEmpManual('');return;
    }

    // Look up employee by their stored ID — which is exactly the QR value scanned at registration
    const emp=await db.getEmployeeById(val);
    if(!emp){toast.show('Employee not found for QR: '+val,'error');return;}
    setVerifiedEmp(emp);setStep('tokens');
    toast.show('✔ Employee verified: '+emp.name,'success');
    setTimeout(()=>tokInputRef.current?.focus(),300);
  };

  // ── STEP 2: assign token ──
  const assignToken=async(raw)=>{
    const tokenId=raw.trim().toUpperCase();
    if(!tokenId||!verifiedEmp){toast.show('❌ Scan employee first','error');return;}

    // Block if token QR is actually a supervisor QR
    const allSups=await db.getSupervisors();
    const isSup=allSups.find(s=>s.qrId===tokenId||s.id===tokenId);
    if(isSup){toast.show('❌ Supervisor QR cannot receive tokens','error');setTokManual('');return;}

    setTokBusy(true);
    try{
      await db.assignToken(tokenId,verifiedEmp.id,user.id,user.name,sessionId);
      setSessionTokens(p=>[...p,{tokenId,empId:verifiedEmp.id,empName:verifiedEmp.name,at:new Date().toLocaleTimeString()}]);
      setTokManual('');
      const updated=await db.getEmployeeById(verifiedEmp.id);
      if(updated) setVerifiedEmp(updated);
      toast.show(`✓ ${tokenId} → ${verifiedEmp.name}`,'success');
    }catch(e){toast.show(e.message,'error');}
    finally{setTokBusy(false);setTokCam(false);setTimeout(()=>tokInputRef.current?.focus(),100);}
  };

  const resetSession=()=>{setStep('verify');setVerifiedEmp(null);setSessionTokens([]);setEmpManual('');setTokManual('');};
  const fEmps=employees.filter(e=>e.name.toLowerCase().includes(empSearch.toLowerCase())||e.id.toLowerCase().includes(empSearch.toLowerCase()));

  return(
    <div>
      {/* ── STEP INDICATOR ── */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
        <div style={{display:'flex',alignItems:'center',gap:6,fontFamily:'var(--mono)',fontSize:11}}>
          <div style={{width:24,height:24,borderRadius:'50%',background:step==='verify'?'var(--accent)':'var(--accent2)',color:'#07070d',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700}}>1</div>
          <span style={{color:step==='verify'?'var(--accent)':'var(--accent2)'}}>Verify Employee</span>
        </div>
        <div style={{flex:1,height:1,background:step==='tokens'?'var(--accent2)':'var(--border)'}}/>
        <div style={{display:'flex',alignItems:'center',gap:6,fontFamily:'var(--mono)',fontSize:11}}>
          <div style={{width:24,height:24,borderRadius:'50%',background:step==='tokens'?'var(--accent2)':'var(--border2)',color:step==='tokens'?'#07070d':'var(--muted)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700}}>2</div>
          <span style={{color:step==='tokens'?'var(--accent2)':'var(--muted)'}}>Assign Tokens</span>
        </div>
        {verifiedEmp&&<button className="btn btn-ghost btn-sm" onClick={resetSession}>↩ New Employee</button>}
      </div>

      {/* ── STEP 1: VERIFY ── */}
      {step==='verify'&&(
        <div className="g2">
          <div>
            <div className="card">
              <div className="ct">Scan Employee QR Card</div>
              {empCam?(
                <CamScanner onScan={verifyEmployee} onClose={()=>setEmpCam(false)} label="Scan employee QR card..."/>
              ):(
                <div className="scanbox">
                  <div className="scan-icon">🪪</div>
                  <div className="scan-hint">Scan the employee's QR card or enter their Employee ID</div>
                  <input className="scan-input" value={empManual} onChange={e=>setEmpManual(e.target.value.toUpperCase())} onKeyDown={e=>e.key==='Enter'&&verifyEmployee(empManual)} placeholder="EMP001" autoFocus/>
                  <div style={{display:'flex',gap:8,justifyContent:'center',marginTop:12}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setEmpCam(true)}>📷 Camera</button>
                    <button className="btn btn-success btn-sm" onClick={()=>verifyEmployee(empManual)} disabled={!empManual.trim()}>Verify →</button>
                  </div>
                </div>
              )}
            </div>
          </div>
          <div>
            <div className="card">
              <div className="ct">Or select from list</div>
              <div className="sbar"><input value={empSearch} onChange={e=>setEmpSearch(e.target.value)} placeholder="Search employee..."/></div>
              <div style={{maxHeight:320,overflowY:'auto'}}>
                {fEmps.map(e=>(
                  <div key={e.id} className="erow" onClick={()=>verifyEmployee(e.id)}>
                    <div className="avt avt-y">{e.name.charAt(0)}</div>
                    <div className="ei"><div className="en">{e.name}</div><div className="er">{e.id}</div></div>
                    <div><div className="etok" style={{fontSize:13}}>{e.totalTokens||0}</div><div className="etl">tokens</div></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── STEP 2: ASSIGN TOKENS ── */}
      {step==='tokens'&&verifiedEmp&&(
        <div className="g2">
          <div>
            <div className="card mb14" style={{borderColor:'var(--accent2)'}}>
              <div className="verify-badge vb-success pop" style={{marginBottom:14}}>✓ Employee Verified</div>
              <div className="erow" style={{cursor:'default'}}>
                <div className="avt avt-g">{verifiedEmp.name.charAt(0)}</div>
                <div className="ei">
                  <div className="en">{verifiedEmp.name}</div>
                  <div className="er">{verifiedEmp.id}</div>
                  {verifiedEmp.mobile&&<div className="er">📞 {verifiedEmp.mobile}</div>}
                </div>
                <div><div className="etok">{verifiedEmp.totalTokens||0}</div><div className="etl">tokens</div></div>
              </div>
            </div>

            <div className="card">
              <div className="ct">Scan Token QR</div>
              {tokCam?(
                <CamScanner onScan={assignToken} onClose={()=>setTokCam(false)} label="Scan token QR code..."/>
              ):(
                <div className={`scanbox ${tokManual?'live':''}`}>
                  <div className="scan-icon">🎟️</div>
                  <div className="scan-hint">Assigning to <strong style={{color:'var(--accent2)'}}>{verifiedEmp.id}</strong></div>
                  <input ref={tokInputRef} className="scan-input" value={tokManual} onChange={e=>setTokManual(e.target.value.toUpperCase())} onKeyDown={e=>e.key==='Enter'&&assignToken(tokManual)} placeholder="TKN000001" autoFocus/>
                  <div style={{display:'flex',gap:8,justifyContent:'center',marginTop:12}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setTokCam(true)}>📷 Camera</button>
                    <button className="btn btn-success btn-sm" onClick={()=>assignToken(tokManual)} disabled={tokBusy||!tokManual.trim()}>
                      {tokBusy?'Assigning...':'✓ Assign Token'}
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>

          <div>
            <div className="card">
              <div className="sh">
                <div className="ct" style={{margin:0}}>Session Log</div>
                <span className="badge b-yellow">{sessionTokens.length} assigned</span>
              </div>
              {sessionTokens.length===0?(
                <div style={{textAlign:'center',padding:32,color:'var(--muted)',fontSize:13}}>No tokens assigned yet this session</div>
              ):(
                <div style={{maxHeight:360,overflowY:'auto'}}>
                  {[...sessionTokens].reverse().map((t,i)=>(
                    <div key={i} className="slog-item">
                      <span className="mc" style={{color:'var(--accent2)'}}>{t.tokenId}</span>
                      <span style={{color:'var(--muted)',fontSize:10}}>{t.at}</span>
                    </div>
                  ))}
                </div>
              )}
              {sessionTokens.length>0&&(
                <div style={{marginTop:12,fontSize:10,color:'var(--muted)',fontFamily:'var(--mono)'}}>
                  Session: {sessionId.slice(0,16)}<br/>
                  Emp: {verifiedEmp.id}
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// APP ROOT
// ═══════════════════════════════════════════════════
function App(){
  const[user,setUser]=useState(null);
  const toast=useToast();
  return(
    <div className="app">
      {!user?<Login onLogin={setUser}/>:(
        <>
          <div className="topbar">
            <div className="brand"><div className="brand-dot"/>TOKENPAY</div>
            <div className="topbar-r">
              <span style={{fontSize:12,color:'var(--muted2)'}}>{user.name}</span>
              <span className={`rbadge ${user.role}`}>{user.role.toUpperCase()}</span>
              <button className="btn-out" onClick={()=>setUser(null)}>LOGOUT</button>
            </div>
          </div>
          <div className="main">
            <div className="demo-banner">⚡ TOKENPAY LIVE — Powered by Firebase · {new Date().toLocaleDateString('en-IN')}</div>
            {user.role==='admin'
              ?<AdminDashboard user={user} toast={toast}/>
              :<SupervisorPanel user={user} toast={toast}/>
            }
          </div>
        </>
      )}
      <div className="toast-wrap">
        {toast.toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
