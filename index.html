      {empHistory.length===0?(<div className="card" style={{textAlign:'center',padding:40,color:'var(--muted)'}}>No token history found</div>):(empHistory.map(e=>(<div key={e.id} className="card mb14">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}}><div style={{display:'flex',alignItems:'center',gap:10}}><div className="avt avt-y">{e.name.charAt(0)}</div><div><div style={{fontWeight:600,fontSize:15}}>{e.name}</div><div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--primary)',marginTop:2}}>{e.id}</div>{e.mobile&&<div style={{fontSize:11,color:'var(--muted)',marginTop:1}}>📞 {e.mobile}</div>}</div></div><div style={{textAlign:'right'}}><div style={{fontFamily:'var(--mono)',fontSize:22,color:'var(--success)'}}>{e.assignedToks.length}</div><div style={{fontSize:10,color:'var(--muted)'}}>tokens</div></div></div>
        <div className="g4 mb14" style={{gap:8}}><div style={{padding:10,background:'var(--surface2)',borderRadius:8,textAlign:'center'}}><div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:4}}>PENDING</div><div style={{fontFamily:'var(--mono)',fontSize:18,color:'var(--success)'}}>{e.totalTokens||0}</div></div><div style={{padding:10,background:'var(--surface2)',borderRadius:8,textAlign:'center'}}><div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:4}}>PAID TOKENS</div><div style={{fontFamily:'var(--mono)',fontSize:18,color:'var(--muted)'}}>{e.paidTokens||0}</div></div><div style={{padding:10,background:'var(--surface2)',borderRadius:8,textAlign:'center'}}><div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:4}}>RANGE VALUE</div><div style={{fontFamily:'var(--mono)',fontSize:18,color:'var(--primary)'}}>₹{e.totalValue.toLocaleString('en-IN')}</div></div><div style={{padding:10,background:'var(--surface2)',borderRadius:8,textAlign:'center'}}><div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:4}}>TOTAL PAID</div><div style={{fontFamily:'var(--mono)',fontSize:18,color:'var(--primary)'}}>₹{e.totalPaid.toLocaleString('en-IN')}</div></div></div>
        <div className="tw"><table><thead><tr><th>Token</th><th>Value</th><th>Assigned By</th><th>Date</th><th>Time</th></tr></thead><tbody>{e.assignedToks.sort((a,b)=>(b.assignedAt||'').localeCompare(a.assignedAt||'')).map(t=>(<tr key={t.id}><td className="mc" style={{color:'var(--success)'}}>{t.id}</td><td style={{fontFamily:'var(--mono)',color:'var(--primary)',fontSize:11}}>₹{t.value||TOKEN_VALUE}</td><td style={{fontSize:11}}>{t.assignedBy||'—'}</td><td style={{fontSize:10,color:'var(--muted)'}}>{t.lockedDate||'—'}</td><td style={{fontSize:10,color:'var(--muted)'}}>{fmtTime(t.assignedAt)}</td></tr>))}</tbody></table></div>
        {e.txns.length>0&&(<div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}}><div className="ct" style={{marginBottom:8}}>Payout History</div><div className="tw"><table><thead><tr><th>Txn ID</th><th>Tokens Paid</th><th>Amount</th><th>Date</th></tr></thead><tbody>{e.txns.map(t=>(<tr key={t.id}><td className="mc" style={{fontSize:9,color:'var(--muted)'}}>{t.id}</td><td className="mc" style={{color:'var(--success)'}}>{t.tokensPaid}</td><td style={{fontFamily:'var(--mono)',color:'var(--primary)',fontSize:12}}>₹{t.amount.toLocaleString('en-IN')}</td><td style={{fontSize:10,color:'var(--muted)'}}>{t.date}</td></tr>))}</tbody></table></div></div>)}
      </div>)))}
    </div>)}

    {rTab==='supervisor'&&(<div>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:10}}><div style={{flex:1,minWidth:300}}><DateFilter fromDate={fromDate} toDate={toDate} setFromDate={setFromDate} setToDate={setToDate}/></div><div style={{paddingTop:4}}><XlBtn onClick={exportSupervisor} disabled={supRows.length===0}/></div></div>
      <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:16,padding:'12px 14px',background:'var(--surface2)',borderRadius:8,flexWrap:'wrap'}}><div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',letterSpacing:1}}>FILTER SUPERVISOR</div><select value={selSup} onChange={e=>setSelSup(e.target.value)} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:6,padding:'6px 10px',color:'var(--text)',fontSize:12,minWidth:200}}><option value=''>All Supervisors</option>{supervisors.map(s=><option key={s.id} value={s.id}>{s.name} ({s.id})</option>)}</select>{selSup&&<button className="btn btn-ghost btn-sm" onClick={()=>setSelSup('')}>✕ Clear</button>}</div>
      <div className="card mb14"><div className="ct">Supervisor performance</div><div className="tw"><table><thead><tr><th>Supervisor</th><th>ID</th><th>Tokens Assigned</th><th>Total Value</th></tr></thead><tbody>{supTotals.length===0&&<tr><td colSpan={4} style={{textAlign:'center',color:'var(--muted)',padding:24}}>No activity in range</td></tr>}{supTotals.map(s=>(<tr key={s.id}><td><div style={{display:'flex',alignItems:'center',gap:8}}><div className="avt avt-p" style={{width:26,height:26,fontSize:10}}>{s.name.charAt(0)}</div>{s.name}</div></td><td className="mc" style={{color:'var(--purple)'}}>{s.id}</td><td><span style={{fontFamily:'var(--mono)',color:'var(--success)',fontSize:15}}>{s.periodCount}</span></td><td style={{fontFamily:'var(--mono)',color:'var(--primary)',fontSize:12}}>₹{s.periodValue.toLocaleString('en-IN')}</td></tr>))}</tbody></table></div></div>
      <div className="card"><div className="ct">Day-by-day supervisor log</div><div className="tw"><table><thead><tr><th>Date</th><th>Supervisor</th><th>ID</th><th>Tokens</th><th>Value</th></tr></thead><tbody>{supRows.length===0&&<tr><td colSpan={5} style={{textAlign:'center',color:'var(--muted)',padding:24}}>No activity in range</td></tr>}{supRows.map((row,i)=>(<tr key={i}><td style={{fontFamily:'var(--mono)',color:'var(--primary)',fontSize:11}}>{row.date}</td><td>{row.supName||row.supId}</td><td className="mc" style={{color:'var(--purple)'}}>{row.supId}</td><td><span style={{fontFamily:'var(--mono)',color:'var(--success)'}}>{row.count}</span></td><td style={{fontFamily:'var(--mono)',color:'var(--primary)',fontSize:11}}>₹{row.value.toLocaleString('en-IN')}</td></tr>))}</tbody></table></div></div>
    </div>)}

    {rTab==='payout'&&(<div>
      <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',marginBottom:16,padding:'12px 14px',background:'var(--surface2)',borderRadius:8}}><div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',letterSpacing:1}}>DATE RANGE</div><div style={{display:'flex',gap:8,alignItems:'center'}}><input type="date" value={txFromDate} onChange={e=>setTxFromDate(e.target.value)} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 8px',color:'var(--text)',fontFamily:'var(--mono)',fontSize:11}}/><span style={{color:'var(--muted)',fontSize:11}}>to</span><input type="date" value={txToDate} onChange={e=>setTxToDate(e.target.value)} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 8px',color:'var(--text)',fontFamily:'var(--mono)',fontSize:11}}/></div><button className="btn btn-ghost btn-sm" onClick={()=>{setTxFromDate('');setTxToDate('');}}>Show All</button><button className="btn btn-ghost btn-sm" onClick={()=>{setTxFromDate(today());setTxToDate(today());}}>Today</button><XlBtn onClick={exportPayout} disabled={filteredTxns.length===0}/></div>
      <div className="g3 mb14"><div className="card"><div className="ct">Transactions</div><div className="stat-n" style={{color:'var(--purple)'}}>{filteredTxns.length}</div><div className="stat-l">in range</div></div><div className="card"><div className="ct">Tokens Paid</div><div className="stat-n" style={{color:'var(--success)'}}>{txTokens}</div><div className="stat-l">total</div></div><div className="card"><div className="ct">Amount Paid</div><div className="stat-n" style={{fontSize:20}}>₹{txTotal.toLocaleString('en-IN')}</div><div className="stat-l">total</div></div></div>
      <div className="card"><div className="ct">Payment records</div>{filteredTxns.length===0?(<div style={{textAlign:'center',padding:32,color:'var(--muted)',fontSize:13}}>No transactions in selected range</div>):(<div className="tw"><table><thead><tr><th>Txn ID</th><th>Employee</th><th>ID</th><th>Tokens Paid</th><th>Amount</th><th>Date</th><th>Time</th></tr></thead><tbody>{filteredTxns.map(t=>(<tr key={t.id}><td className="mc" style={{fontSize:9,color:'var(--muted)'}}>{t.id}</td><td>{t.employeeName}</td><td className="mc" style={{color:'var(--primary)'}}>{t.employeeId}</td><td><span style={{fontFamily:'var(--mono)',color:'var(--success)'}}>{t.tokensPaid}</span></td><td style={{fontFamily:'var(--mono)',color:'var(--primary)',fontSize:13}}>₹{t.amount.toLocaleString('en-IN')}</td><td style={{fontSize:10,color:'var(--muted)'}}>{t.date}</td><td style={{fontSize:10,color:'var(--muted)'}}>{fmtTime(t.timestamp)}</td></tr>))}</tbody></table></div>)}</div>
    </div>)}
  </div>);
}

function AdminDashboard({user,toast}){
  const[tab,setTab]=useState('overview');
  const[employees,setEmployees]=useState([]);
  const[tokens,setTokens]=useState([]);
  const[supervisors,setSupervisors]=useState([]);
  const[transactions,setTransactions]=useState([]);
  const[showAddEmp,setShowAddEmp]=useState(false);
  const[showAddSup,setShowAddSup]=useState(false);
  const[showScan,setShowScan]=useState(false);
  const[showRegToken,setShowRegToken]=useState(false);
  const[editSup,setEditSup]=useState(null);
  const[editEmp,setEditEmp]=useState(null);
  const[editTok,setEditTok]=useState(null);
  const[payoutEmp,setPayoutEmp]=useState(null);
  const[searchEmp,setSearchEmp]=useState('');
  const[searchTok,setSearchTok]=useState('');

  // CHANGE 3: Real-time listeners — admin sees live updates without refresh
  useEffect(()=>{
    const unsub1=firestore.collection('employees').orderBy('name').onSnapshot(snap=>{setEmployees(snap.docs.map(d=>d.data()));});
    const unsub2=firestore.collection('tokens').onSnapshot(snap=>{setTokens(snap.docs.map(d=>d.data()));});
    const unsub3=firestore.collection('supervisors').onSnapshot(snap=>{setSupervisors(snap.docs.map(d=>d.data()));});
    const unsub4=firestore.collection('transactions').orderBy('timestamp','desc').onSnapshot(snap=>{setTransactions(snap.docs.map(d=>d.data()));});
    return()=>{unsub1();unsub2();unsub3();unsub4();};
  },[]);
  const load=async()=>{
    const[e,t,s,tx]=await Promise.all([db.getEmployees(),db.getTokens(),db.getSupervisors(),db.getTransactions()]);
    setEmployees(e);setTokens(t);setSupervisors(s);setTransactions(tx);
  };

  const assigned=tokens.filter(t=>t.assignedTo).length;
  const totalToks=employees.reduce((s,e)=>s+(e.totalTokens||0),0);
  const totalPaid=transactions.reduce((s,t)=>s+t.amount,0);

  const handleRemoveEmp=async(id,name)=>{if(!window.confirm(`Remove employee ${name}? This cannot be undone.`))return;await db.removeEmployee(id);toast.show('Employee removed','info');load();};
  const handleRemoveSup=async(id,name)=>{if(!window.confirm(`Remove supervisor ${name}?`))return;await db.removeSupervisor(id);toast.show('Supervisor removed','info');load();};

  // ── CHANGE 1: Delete token with pre-assignment warning ──
  const handleDeleteToken=async(tok)=>{
    const msg=tok.assignedTo
      ?`⚠️ This token (${tok.id}) is currently assigned to employee ${tok.assignedTo}.\n\nDeleting it will remove it from their token balance and free it from all records.\n\nContinue?`
      :`Delete token ${tok.id}? This cannot be undone.`;
    if(!window.confirm(msg))return;
    try{
      await db.deleteToken(tok.id);
      toast.show(`Token ${tok.id} deleted${tok.assignedTo?' and removed from '+tok.assignedTo:''}`, 'info');
      load();
    }catch(e){toast.show(e.message,'error');}
  };

  const fEmps=employees.filter(e=>e.name.toLowerCase().includes(searchEmp.toLowerCase())||e.id.toLowerCase().includes(searchEmp.toLowerCase())||(e.mobile||'').includes(searchEmp));
  const todayTokens=tokens.filter(t=>t.lockedDate===today());
  const TABS=['overview','employees','supervisors','tokens','register-tokens','token-search','reports','payout'];

  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
      <div/><button className="btn btn-ghost btn-sm" onClick={()=>setShowScan(true)}>🔍 Universal Scan</button>
    </div>
    <div className="tabs">{TABS.map(t=>(<button key={t} className={`tab ${tab===t?'active':''}`} onClick={()=>setTab(t)}>{t.replace('-',' ')}</button>))}</div>

    {tab==='overview'&&(<>
      <div className="g4 mb14">
        <div className="card stat-card blue"><div className="ct">Employees</div><div className="stat-n">{employees.length}</div><div className="stat-l">registered</div></div>
        <div className="card stat-card purple"><div className="ct">Supervisors</div><div className="stat-n" style={{color:'var(--purple)'}}>{supervisors.length}</div><div className="stat-l">active</div></div>
        <div className="card stat-card green"><div className="ct">Tokens Pending</div><div className="stat-n" style={{color:'var(--success)'}}>{totalToks}</div><div className="stat-l">this period</div></div>
        <div className="card stat-card gold"><div className="ct">Total Paid Out</div><div className="stat-n" style={{color:'var(--warn)'}}>₹{totalPaid.toLocaleString('en-IN')}</div><div className="stat-l">all time</div></div>
      </div>
      <div className="g2">
        <div className="card"><div className="ct">Top earners — current period</div>{[...employees].sort((a,b)=>(b.totalTokens||0)-(a.totalTokens||0)).slice(0,6).map(e=>(<div key={e.id} className="erow" style={{cursor:'default'}}><div className="avt avt-y">{e.name.charAt(0)}</div><div className="ei"><div className="en">{e.name}</div><div className="er">{e.id}</div></div><div><div className="etok">{e.totalTokens||0}</div><div className="etl">tokens</div></div></div>))}</div>
        <div className="card"><div className="ct">Today's activity</div>
          <div className="g2" style={{marginBottom:12}}><div style={{padding:12,background:'var(--surface2)',borderRadius:8,textAlign:'center'}}><div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:4}}>TODAY TOKENS</div><div style={{fontFamily:'var(--mono)',fontSize:24,color:'var(--success)'}}>{todayTokens.length}</div></div><div style={{padding:12,background:'var(--surface2)',borderRadius:8,textAlign:'center'}}><div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginBottom:4}}>TODAY TXN</div><div style={{fontFamily:'var(--mono)',fontSize:24,color:'var(--primary)'}}>{transactions.filter(t=>t.date===today()).length}</div></div></div>
          {transactions.slice(-3).reverse().map(t=>(<div key={t.id} className="slog-item"><span style={{fontSize:12}}>{t.employeeName}</span><span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--success)'}}>₹{t.amount.toLocaleString('en-IN')}</span></div>))}
          {transactions.length===0&&<div style={{textAlign:'center',padding:20,color:'var(--muted)',fontSize:12}}>No transactions yet</div>}
        </div>
      </div>
    </>)}

    {tab==='employees'&&(<>
      <div className="sh mb14"><span className="st">Employee Profiles ({employees.length})</span><button className="btn btn-success btn-sm" onClick={()=>setShowAddEmp(true)}>+ Register Employee</button></div>
      <div className="card">
        <div className="sbar"><input value={searchEmp} onChange={e=>setSearchEmp(e.target.value)} placeholder="Search name, EMP ID, mobile..."/></div>
        <div className="tw"><table><thead><tr><th>Employee</th><th>ID</th><th>Mobile</th><th>Pending Tokens</th><th>Lifetime Paid</th><th>Payable</th><th>Actions</th></tr></thead>
        <tbody>{fEmps.map(e=>(<tr key={e.id}>
          <td><div style={{display:'flex',alignItems:'center',gap:8}}><div className="avt avt-y" style={{width:28,height:28,fontSize:10}}>{e.name.charAt(0)}</div>{e.name}</div></td>
          <td className="mc" style={{color:'var(--primary)'}}>{e.id}</td>
          <td className="mc" style={{color:'var(--muted)'}}>{e.mobile||'—'}</td>
          <td><span style={{fontFamily:'var(--mono)',color:'var(--success)'}}>{e.totalTokens||0}</span></td>
          <td className="mc" style={{color:'var(--muted)'}}>{e.paidTokens||0}</td>
          <td style={{fontFamily:'var(--mono)',color:'var(--primary)',fontSize:12}}>
            ₹{tokens.filter(t=>t.assignedTo===e.id).reduce((s,t)=>s+(t.value||TOKEN_VALUE),0).toLocaleString('en-IN')}
          </td>
          <td><div style={{display:'flex',gap:6,flexWrap:'wrap',minWidth:0}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setEditEmp(e)}>✏️</button>
            <button className="btn btn-warn btn-sm" onClick={()=>setPayoutEmp(e)}>💰 Pay</button>
            <button className="btn btn-danger btn-sm" onClick={async()=>{
              if(!window.confirm(`Reset ALL tokens for ${e.name}? Remaining balance will be recorded.`))return;
              try{
                const bal=(e.totalTokens||0)*(e.tokenValue||TOKEN_VALUE);
                await firestore.collection('employees').doc(e.id).update({balanceAmount:firebase.firestore.FieldValue.increment(bal)});
                await db.payEmployee(e.id,e.totalTokens,true);
                toast.show('Token reset completed for '+e.name,'success');load();
              }catch(err){toast.show(err.message,'error');}
            }}>↺ Reset</button>
            <button className="btn btn-danger btn-sm" onClick={()=>handleRemoveEmp(e.id,e.name)}>🗑</button>
          </div></td>
        </tr>))}</tbody></table></div>
      </div>
    </>)}

    {tab==='supervisors'&&(<>
      <div className="sh mb14"><span className="st">Supervisor Accounts ({supervisors.length})</span><button className="btn btn-success btn-sm" onClick={()=>setShowAddSup(true)}>+ Register Supervisor</button></div>
      <div className="card"><div className="tw"><table><thead><tr><th>Name</th><th>ID</th><th>Mobile</th><th>Username</th><th>QR ID</th><th>Tokens Assigned</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>{supervisors.map(s=>{const asgn=tokens.filter(t=>t.assignedBySup===s.id).length;return(<tr key={s.id}>
        <td><div style={{display:'flex',alignItems:'center',gap:8}}><div className="avt avt-p" style={{width:28,height:28,fontSize:10}}>{s.name.charAt(0)}</div>{s.name}</div></td>
        <td className="mc" style={{color:'var(--purple)'}}>{s.id}</td>
        <td className="mc" style={{color:'var(--muted)'}}>{s.mobile||'—'}</td>
        <td className="mc">{s.username}</td>
        <td className="mc" style={{color:'var(--purple)',fontSize:10}}>{s.qrId}</td>
        <td><span style={{fontFamily:'var(--mono)',color:'var(--success)'}}>{asgn}</span></td>
        <td><span className="badge b-green">Active</span></td>
        <td><div style={{display:'flex',gap:6}}><button className="btn btn-ghost btn-sm" onClick={()=>setEditSup(s)}>✏️</button><button className="btn btn-danger btn-sm" onClick={()=>handleRemoveSup(s.id,s.name)}>🗑</button></div></td>
      </tr>);})}</tbody></table></div></div>
    </>)}

    {tab==='tokens'&&(
      <div className="card">
        <div className="sh"><span className="st">Token Pool ({tokens.length})</span><span className="badge b-yellow">{assigned} assigned</span></div>
        <div className="sbar"><input value={searchTok} onChange={e=>setSearchTok(e.target.value)} placeholder="Search token ID or employee ID..."/></div>
        <div className="tw"><table><thead><tr><th>Token</th><th>Status</th><th>Employee</th><th>Assigned By</th><th>Date</th><th>Time</th><th>Action</th></tr></thead>
        <tbody>{tokens.filter(t=>t.id.includes(searchTok.toUpperCase())||(t.assignedTo||'').includes(searchTok.toUpperCase())).slice(0,80).map(t=>(<tr key={t.id}>
          <td className="mc">{t.id}</td>
          <td><span className={`badge ${t.assignedTo?'b-green':'b-gray'}`}>{t.assignedTo?'Assigned':'Free'}</span></td>
          <td className="mc" style={{color:'var(--primary)'}}>{t.assignedTo||'—'}</td>
          <td style={{fontSize:11,color:'var(--muted)'}}>{t.assignedBy||'—'}</td>
          <td style={{fontSize:10,color:'var(--muted)'}}>{t.lockedDate||'—'}</td>
          <td style={{fontSize:10,color:'var(--muted)'}}>{t.assignedAt?fmtTime(t.assignedAt):'—'}</td>
          <td><button className="btn btn-danger btn-sm" onClick={()=>handleDeleteToken(t)}>🗑 Delete</button></td>
        </tr>))}</tbody></table></div>
      </div>
    )}

    {tab==='register-tokens'&&(<div>
      <div className="sh mb14"><span className="st">Token Registry ({tokens.length} registered)</span><button className="btn btn-success btn-sm" onClick={()=>setShowRegToken(true)}>+ Register Token</button></div>
      <div className="verify-badge vb-info mb14" style={{justifyContent:'flex-start',gap:8}}>🎟️ Register each physical token QR card here before supervisors can assign them. Default ₹{TOKEN_VALUE}/token.</div>
      <div className="card"><div className="tw"><table><thead><tr><th>Token ID</th><th>Value (₹)</th><th>Status</th><th>Assigned To</th><th>Assigned By</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody>
        {tokens.length===0&&(<tr><td colSpan={7} style={{textAlign:'center',color:'var(--muted)',padding:32}}>No tokens registered yet. Click "+ Register Token" to add.</td></tr>)}
        {[...tokens].reverse().map(t=>(<tr key={t.id}>
          <td className="mc" style={{color:'var(--success)'}}>{t.id}</td>
          <td style={{fontFamily:'var(--mono)',color:'var(--primary)'}}>₹{t.value||TOKEN_VALUE}</td>
          <td><span className={`badge ${t.assignedTo?'b-green':'b-gray'}`}>{t.assignedTo?'Assigned':'Free'}</span></td>
          <td className="mc" style={{color:'var(--primary)'}}>{t.assignedTo||'—'}</td>
          <td style={{fontSize:11,color:'var(--muted)'}}>{t.assignedBy||'—'}</td>
          <td style={{fontSize:10,color:'var(--muted)'}}>{t.lockedDate||'—'}</td>
          <td><div style={{display:'flex',gap:6}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setEditTok(t)}>✏️ Edit</button>
            <button className="btn btn-danger btn-sm" onClick={()=>handleDeleteToken(t)}>🗑 Delete</button>
          </div></td>
        </tr>))}
      </tbody></table></div></div>
    </div>)}

    {tab==='token-search'&&(<TokenSearchPanel toast={toast}/>)}
    {tab==='reports'&&(<ReportsPanel tokens={tokens} employees={employees} supervisors={supervisors} transactions={transactions}/>)}

    {tab==='payout'&&(<div>
      <div className="sh mb14"><span className="st">Payout Panel</span><span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--muted)'}}>Select tokens to pay per employee</span></div>
      <div className="g2 mb14">
        {employees.filter(e=>(e.totalTokens||0)>0).length===0&&(<div className="card" style={{gridColumn:'1/-1',textAlign:'center',padding:40,color:'var(--muted)'}}>No employees with pending tokens</div>)}
        {employees.filter(e=>(e.totalTokens||0)>0).sort((a,b)=>b.totalTokens-a.totalTokens).map(e=>(<div key={e.id} className="card" style={{borderColor:'rgba(61,232,160,.2)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}><div className="avt avt-y">{e.name.charAt(0)}</div><div><div style={{fontWeight:600}}>{e.name}</div><div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--primary)',marginTop:2}}>{e.id}</div></div></div>
            <span className="badge b-green">{e.totalTokens} tokens</span>
          </div>
          <div className="payout-box" style={{padding:14,marginBottom:12}}>
            <div style={{fontSize:11,color:'var(--muted)'}}>Max Payable</div>
            <div style={{fontFamily:'var(--mono)',fontSize:26,color:'var(--success)',lineHeight:1.2}}>₹{tokens.filter(t=>t.assignedTo===e.id).reduce((s,t)=>s+(t.value||TOKEN_VALUE),0).toLocaleString('en-IN')}</div>
          </div>
          <button className="btn btn-warn btn-full btn-sm" onClick={()=>setPayoutEmp(e)}>SELECT TOKENS & PAY →</button>
        </div>))}
      </div>
      <div className="card"><div className="ct">Payment History ({transactions.length})</div>
        {transactions.length===0?(<div style={{textAlign:'center',padding:24,color:'var(--muted)',fontSize:12}}>No transactions yet</div>):(
          <div className="tw"><table><thead><tr><th>Txn ID</th><th>Employee</th><th>ID</th><th>Tokens Paid</th><th>Amount</th><th>Remaining</th><th>Date</th></tr></thead>
          <tbody>{[...transactions].reverse().map(t=>(<tr key={t.id}>
            <td className="mc" style={{fontSize:10,color:'var(--muted)'}}>{t.id}</td>
            <td>{t.employeeName}</td>
            <td className="mc" style={{color:'var(--primary)'}}>{t.employeeId}</td>
            <td><span style={{fontFamily:'var(--mono)',color:'var(--success)'}}>{t.tokensPaid}</span></td>
            <td style={{fontFamily:'var(--mono)',color:'var(--primary)',fontSize:13}}>₹{t.amount.toLocaleString('en-IN')}</td>
            <td style={{fontFamily:'var(--mono)',color:'var(--warn)',fontWeight:600}}>₹{t.remainingAmount!==undefined?t.remainingAmount:(t.remainingTokens||0)*TOKEN_VALUE}</td>
            <td style={{fontSize:11,color:'var(--muted)'}}>{t.date}</td>
          </tr>))}</tbody></table></div>
        )}
      </div>
    </div>)}

    {showAddEmp&&<AddEmployeeModal onClose={()=>setShowAddEmp(false)} onSaved={load} toast={toast}/>}
    {showAddSup&&<AddSupervisorModal onClose={()=>setShowAddSup(false)} onSaved={load} toast={toast}/>}
    {showScan&&<UniversalScanModal onClose={()=>setShowScan(false)} toast={toast}/>}
    {showRegToken&&<RegisterTokenModal onClose={()=>setShowRegToken(false)} onSaved={load} toast={toast}/>}
    {editEmp&&<EditEmployeeModal emp={editEmp} onClose={()=>setEditEmp(null)} onSaved={load} toast={toast}/>}
    {editTok&&<EditTokenModal tok={editTok} onClose={()=>setEditTok(null)} onSaved={load} toast={toast}/>}
    {editSup&&<EditSupervisorModal sup={editSup} onClose={()=>setEditSup(null)} onSaved={load} toast={toast}/>}
    {payoutEmp&&<PayoutModal emp={payoutEmp} onClose={()=>setPayoutEmp(null)} onDone={load} toast={toast}/>}
  </div>);
}

function SupervisorPanel({user,toast}){
  const[employees,setEmployees]=useState([]);
  const[step,setStep]=useState('verify');
  const[verifiedEmp,setVerifiedEmp]=useState(null);
  const[sessionTokens,setSessionTokens]=useState([]);
  const[sessionId]=useState(`SES-${Date.now()}`);
  const[feedback,setFeedback]=useState(null);
  const[empSearch,setEmpSearch]=useState('');
  const[empCam,setEmpCam]=useState(false);
  const[empManual,setEmpManual]=useState('');
  const[tokCam,setTokCam]=useState(false);
  const[tokManual,setTokManual]=useState('');
  const[tokBusy,setTokBusy]=useState(false);
  const tokInputRef=useRef();
  useEffect(()=>{db.getEmployees().then(setEmployees);},[]);

  const verifyEmployee=async(raw)=>{
    setEmpCam(false);const val=raw.trim().toUpperCase();
    const allSups=await db.getSupervisors();
    const isSup=allSups.find(s=>s.qrId===val||s.id===val);
    if(isSup){setFeedback({type:'error',icon:'🚫',title:'SUPERVISOR QR',sub:'Cannot use supervisor QR as employee'});setEmpManual('');return;}
    const emp=await db.getEmployeeById(val);
    if(!emp){setFeedback({type:'error',icon:'❌',title:'NOT FOUND',sub:'No employee registered for QR: '+val});return;}
    setVerifiedEmp(emp);setStep('tokens');
    setFeedback({type:'success',icon:'✅',title:'VERIFIED',sub:emp.name+'\n'+emp.id});
  };

  const assignToken=async(raw)=>{
    const tokenId=raw.trim().toUpperCase();
    if(!tokenId||!verifiedEmp){setFeedback({type:'error',icon:'❌',title:'SCAN EMPLOYEE FIRST',sub:'Verify employee before assigning token'});return;}
    const allSups=await db.getSupervisors();
    const isSup=allSups.find(s=>s.qrId===tokenId||s.id===tokenId);
    if(isSup){setFeedback({type:'error',icon:'🚫',title:'SUPERVISOR QR',sub:'Supervisor QR cannot receive tokens'});setTokManual('');return;}
    setTokBusy(true);
    try{
      await db.assignToken(tokenId,verifiedEmp.id,user.id,user.name,sessionId);
      setSessionTokens(p=>[...p,{tokenId,empId:verifiedEmp.id,empName:verifiedEmp.name,at:new Date().toLocaleTimeString()}]);
      setTokManual('');
      const updated=await db.getEmployeeById(verifiedEmp.id);
      if(updated)setVerifiedEmp(updated);
      setFeedback({type:'assign',icon:'🎟️',title:'TOKEN ASSIGNED',sub:tokenId+' → '+verifiedEmp.name});
    }catch(e){setFeedback({type:'error',icon:'❌',title:'ERROR',sub:e.message});}
    finally{setTokBusy(false);setTokCam(false);}
  };

  const resetSession=()=>{setStep('verify');setVerifiedEmp(null);setSessionTokens([]);setEmpManual('');setTokManual('');};
  const fEmps=employees.filter(e=>e.name.toLowerCase().includes(empSearch.toLowerCase())||e.id.toLowerCase().includes(empSearch.toLowerCase()));

  return(<div>
    {feedback&&<FullScreenFeedback {...feedback} onDone={()=>setFeedback(null)}/>}
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',gap:6,fontFamily:'var(--mono)',fontSize:11}}>
        <div style={{width:24,height:24,borderRadius:'50%',background:step==='verify'?'var(--accent)':'var(--accent2)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>1</div>
        <span style={{color:step==='verify'?'var(--accent)':'var(--accent2)',fontSize:'clamp(9px,2.5vw,11px)'}}>Verify Employee</span>
      </div>
      <div style={{flex:1,height:1,background:step==='tokens'?'var(--accent2)':'var(--border)'}}/>
      <div style={{display:'flex',alignItems:'center',gap:6,fontFamily:'var(--mono)',fontSize:11}}>
        <div style={{width:24,height:24,borderRadius:'50%',background:step==='tokens'?'var(--accent2)':'var(--border2)',color:step==='tokens'?'#fff':'var(--muted)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>2</div>
        <span style={{color:step==='tokens'?'var(--accent2)':'var(--muted)',fontSize:'clamp(9px,2.5vw,11px)'}}>Assign Tokens</span>
      </div>
      {verifiedEmp&&<button className="btn btn-ghost btn-sm" onClick={resetSession} style={{flexShrink:0}}>↩ New</button>}
    </div>

    {step==='verify'&&(<div className="g2">
      <div><div className="card"><div className="ct">Scan Employee QR Card</div>
        {empCam?(<CamScanner onScan={verifyEmployee} onClose={()=>setEmpCam(false)} label="Scan employee QR card..."/>):(
          <div className="scanbox"><div className="scan-icon">🪪</div><div className="scan-hint">Scan the employee's QR card or enter their Employee ID</div>
            <input className="scan-input" value={empManual} onChange={e=>setEmpManual(e.target.value.toUpperCase())} onKeyDown={e=>e.key==='Enter'&&verifyEmployee(empManual)} placeholder="EMP001" autoFocus/>
            <div style={{display:'flex',gap:8,justifyContent:'center',marginTop:12}}><button className="btn btn-ghost btn-sm" onClick={()=>setEmpCam(true)}>📷 Camera</button><button className="btn btn-success btn-sm" onClick={()=>verifyEmployee(empManual)} disabled={!empManual.trim()}>Verify →</button></div>
          </div>
        )}
      </div></div>
      <div><div className="card"><div className="ct">Or select from list</div>
        <div className="sbar"><input value={empSearch} onChange={e=>setEmpSearch(e.target.value)} placeholder="Search employee..."/></div>
        <div style={{maxHeight:320,overflowY:'auto'}}>{fEmps.map(e=>(<div key={e.id} className="erow" onClick={()=>verifyEmployee(e.id)}><div className="avt avt-y">{e.name.charAt(0)}</div><div className="ei"><div className="en">{e.name}</div><div className="er">{e.id}</div></div><div><div className="etok" style={{fontSize:13}}>{e.totalTokens||0}</div><div className="etl">tokens</div></div></div>))}</div>
      </div></div>
    </div>)}

    {step==='tokens'&&verifiedEmp&&(<div className="g2">
      <div>
        <div className="card mb14" style={{borderColor:'var(--accent2)'}}>
          <div className="verify-badge vb-success pop" style={{marginBottom:14}}>✓ Employee Verified</div>
          <div className="erow" style={{cursor:'default'}}><div className="avt avt-g">{verifiedEmp.name.charAt(0)}</div><div className="ei"><div className="en">{verifiedEmp.name}</div><div className="er">{verifiedEmp.id}</div>{verifiedEmp.mobile&&<div className="er">📞 {verifiedEmp.mobile}</div>}</div><div><div className="etok">{verifiedEmp.totalTokens||0}</div><div className="etl">tokens</div></div></div>
        </div>
        <div className="card"><div className="ct">Scan Token QR</div>
          {tokCam?(<CamScanner onScan={assignToken} onClose={()=>setTokCam(false)} label="Scan token QR code..."/>):(
            <div className="scanbox"><div className="scan-icon">🎟️</div>
              <div className="scan-hint" style={{marginBottom:16}}>Point camera at the token QR card to assign to <strong style={{color:'var(--success)'}}>{verifiedEmp.name}</strong></div>
              <button className="btn btn-success" style={{margin:'0 auto'}} onClick={()=>setTokCam(true)}>📷 Open Camera to Scan Token</button>
              {tokBusy&&<div style={{marginTop:12,fontFamily:'var(--mono)',fontSize:11,color:'var(--success)'}}>Assigning...</div>}
            </div>
          )}
        </div>
      </div>
      <div><div className="card">
        <div className="sh"><div className="ct" style={{margin:0}}>Session Log</div><span className="badge b-yellow">{sessionTokens.length} assigned</span></div>
        {sessionTokens.length===0?(<div style={{textAlign:'center',padding:32,color:'var(--muted)',fontSize:13}}>No tokens assigned yet this session</div>):(
          <div style={{maxHeight:360,overflowY:'auto'}}>{[...sessionTokens].reverse().map((t,i)=>(<div key={i} className="slog-item"><span className="mc" style={{color:'var(--success)'}}>{t.tokenId}</span><span style={{color:'var(--muted)',fontSize:10}}>{t.at}</span></div>))}</div>
        )}
        {sessionTokens.length>0&&(<div style={{marginTop:12,fontSize:10,color:'var(--muted)',fontFamily:'var(--mono)'}}>Session: {sessionId.slice(0,16)}<br/>Emp: {verifiedEmp.id}</div>)}
      </div></div>
    </div>)}
  </div>);
}

function App(){
  const[user,setUser]=useState(null);
  const toast=useToast();
  return(<div className="app">
    {!user?<Login onLogin={setUser}/>:(<>
      <div className="topbar">
        <div className="brand"><div className="brand-dot"/>SS EXPORTS</div>
        <div className="topbar-r">
          <span className="topbar-username">{user.name}</span>
          <span className={`rbadge ${user.role}`}>{user.role.toUpperCase()}</span>
          <button className="btn-out" onClick={()=>setUser(null)}>LOGOUT</button>
        </div>
      </div>
      <div className="main">
        <div className="demo-banner"><span>⚡</span><span>SS EXPORTS · TokenPay Live — Powered by Firebase · {new Date().toLocaleDateString('en-IN')}</span></div>
        {user.role==='admin'?<AdminDashboard user={user} toast={toast}/>:<SupervisorPanel user={user} toast={toast}/>}
      </div>
    </>)}
    <div className="toast-wrap">{toast.toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}</div>
  </div>);
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
